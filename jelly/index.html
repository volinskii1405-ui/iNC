function makeGradientTexture() {
  const c = document.createElement('canvas');
  c.width = 4; c.height = 512;
  const g = c.getContext('2d');
  const grd = g.createLinearGradient(0, 0, 0, 512);
  grd.addColorStop(0, '#b9cbff');
  grd.addColorStop(0.5, '#ecdcff');
  grd.addColorStop(1, '#ffe3d8');
  g.fillStyle = grd;
  g.fillRect(0, 0, 4, 512);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function makePlateTexture(maxAniso) {
  const S = 1024, c = document.createElement('canvas');
  c.width = c.height = S;
  const g = c.getContext('2d');
  const base = g.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
  base.addColorStop(0, '#fffefb'); base.addColorStop(1, '#f4ece4');
  g.fillStyle = base; g.fillRect(0, 0, S, S);
  // горошек — чтобы была видна рефракция сквозь желе
  const step = 52;
  for (let y = step / 2; y < S; y += step) {
    for (let x = (Math.round(y / step) % 2) * step / 2 + step / 4; x < S; x += step) {
      const r = Math.hypot(x - S / 2, y - S / 2);
      if (r > S * 0.45) continue;
      g.fillStyle = r < S * 0.2 ? 'rgba(255, 92, 150, 0.20)' : 'rgba(123, 92, 255, 0.16)';
      g.beginPath(); g.arc(x, y, 6.5, 0, Math.PI * 2); g.fill();
    }
  }
  g.lineWidth = 5; g.strokeStyle = 'rgba(214, 166, 84, 0.65)';
  g.beginPath(); g.arc(S / 2, S / 2, S * 0.475, 0, Math.PI * 2); g.stroke();
  g.lineWidth = 2;
  g.beginPath(); g.arc(S / 2, S / 2, S * 0.462, 0, Math.PI * 2); g.stroke();
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = maxAniso;
  return tex;
}

class JellyView {
  constructor(body, material, levels) {
    this.body = body;
    this.surface = new SurfaceMesh(body, levels);
    const g = new THREE.BufferGeometry();
    this.posAttr = new THREE.BufferAttribute(this.surface.positions, 3).setUsage(THREE.DynamicDrawUsage);
    this.nrmAttr = new THREE.BufferAttribute(this.surface.normals, 3).setUsage(THREE.DynamicDrawUsage);
    g.setAttribute('position', this.posAttr);
    g.setAttribute('normal', this.nrmAttr);
    g.setIndex(new THREE.BufferAttribute(this.surface.indices, 1));
    this.mesh = new THREE.Mesh(g, material);
    this.mesh.castShadow = true;
    this.mesh.receiveShadow = true;
    this.mesh.frustumCulled = false;
    this.update();
  }

  update() {
    const b = this.body;
    const s = b.dying > 0 ? Math.max(b.dying / DYING_TIME, 0.001) : 1;
    this.surface.update(s);
    this.posAttr.needsUpdate = true;
    this.nrmAttr.needsUpdate = true;
  }

  dispose() { this.mesh.geometry.dispose(); }
}

class JellyRenderer {
  constructor(container) {
    const r = this.renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    r.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
    r.setSize(window.innerWidth, window.innerHeight);
    r.shadowMap.enabled = true;
    r.shadowMap.type = THREE.PCFSoftShadowMap;
    r.toneMapping = THREE.ACESFilmicToneMapping;
    r.toneMappingExposure = 1.0;
    container.appendChild(r.domElement);
    this.domElement = r.domElement;

    const scene = this.scene = new THREE.Scene();
    scene.background = makeGradientTexture();
    scene.fog = new THREE.Fog('#efe2fb', 22, 48);
    const pmrem = new THREE.PMREMGenerator(r);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
    scene.environmentIntensity = 0.6;

    this.camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 120);
    this.homePos = new THREE.Vector3(0, 5.6, 9.4);
    this.homeTarget = new THREE.Vector3(0, 0.55, 0);
    this.camera.position.copy(this.homePos);
    this.camera.lookAt(this.homeTarget);

    this._lights();
    this._arena(r.capabilities.getMaxAnisotropy());

    this.materials = new Map();
    this.views = new Map();
    this.levels = 2;
    this._stamp = 0;
    window.addEventListener('resize', () => this.resize());
  }

  _lights() {
    const s = this.scene;
    s.add(new THREE.HemisphereLight('#fff6ff', '#d4c4ff', 1.0));
    const key = new THREE.DirectionalLight('#fff3e6', 2.5);
    key.position.set(4.5, 10, 5.5);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    const sc = key.shadow.camera;
    sc.left = -6.5; sc.right = 6.5; sc.top = 6.5; sc.bottom = -6.5; sc.near = 2; sc.far = 30;
    key.shadow.bias = -0.0004;
    key.shadow.normalBias = 0.03;
    key.shadow.intensity = 0.75;
    s.add(key);
    const rim = new THREE.DirectionalLight('#c4d8ff', 1.4);
    rim.position.set(-6, 5, -7);
    s.add(rim);
  }

  _arena(maxAniso) {
    const s = this.scene, R = 4.2;
    // пол вокруг
    const ground = new THREE.Mesh(new THREE.CircleGeometry(45, 64), new THREE.MeshStandardMaterial({ color: '#e6d9fb', roughness: 1 }));
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.13;
    ground.receiveShadow = true;
    s.add(ground);
    // тарелка: дно + бортик (поверхность вращения)
    const plateMat = new THREE.MeshPhysicalMaterial({ color: '#ffffff', map: makePlateTexture(maxAniso), roughness: 0.32, clearcoat: 0.6, clearcoatRoughness: 0.2 });
    const disc = new THREE.Mesh(new THREE.CircleGeometry(R + 0.02, 128), plateMat);
    disc.rotation.x = -Math.PI / 2;
    disc.receiveShadow = true;
    s.add(disc);
    const prof = [[R, 0], [R + 0.13, 0.03], [R + 0.25, 0.12], [R + 0.36, 0.25], [R + 0.42, 0.33], [R + 0.47, 0.36],
      [R + 0.52, 0.34], [R + 0.52, 0.28], [R + 0.38, 0.06], [R + 0.1, -0.1], [R - 0.3, -0.12], [0, -0.12]]
      .map(([x, y]) => new THREE.Vector2(x, y));
    const rim = new THREE.Mesh(new THREE.LatheGeometry(prof, 128),
      new THREE.MeshPhysicalMaterial({ color: '#fbf7f3', roughness: 0.3, clearcoat: 0.7, clearcoatRoughness: 0.15 }));
    rim.castShadow = true;
    rim.receiveShadow = true;
    s.add(rim);
    // стеклянная стенка (физическая граница арены)
    const glass = new THREE.Mesh(new THREE.CylinderGeometry(R + 0.03, R + 0.03, 1.6, 128, 1, true),
      new THREE.MeshPhysicalMaterial({ color: '#ffffff', transparent: true, opacity: 0.08, roughness: 0.05,
        side: THREE.DoubleSide, depthWrite: false }));
    glass.position.y = 0.8;
    s.add(glass);
    const edge = new THREE.Mesh(new THREE.TorusGeometry(R + 0.03, 0.018, 8, 160),
      new THREE.MeshStandardMaterial({ color: '#ffffff', transparent: true, opacity: 0.55, roughness: 0.2 }));
    edge.rotation.x = Math.PI / 2;
    edge.position.y = 1.6;
    s.add(edge);
  }

  // Материал желе: прозрачность через transmission (рефракция фона),
  // затухание цвета в толще (attenuation), лак (clearcoat) для бликов и
  // имитация подповерхностного рассеивания — мягкое «свечение» к краям силуэта.
  material(hex) {
    let m = this.materials.get(hex);
    if (m) return m;
    const base = new THREE.Color(hex);
    const tint = base.clone().lerp(new THREE.Color('#ffffff'), 0.3);
    m = new THREE.MeshPhysicalMaterial({
      color: tint, roughness: 0.1, metalness: 0,
      transmission: 0.9, thickness: 0.85, ior: 1.34,
      attenuationColor: base, attenuationDistance: 0.5,
      clearcoat: 1, clearcoatRoughness: 0.05,
      specularIntensity: 1,
      emissive: base, emissiveIntensity: 0.05,
    });
    const sss = { value: base.clone().multiplyScalar(0.55) };
    m.onBeforeCompile = (shader) => {
      shader.uniforms.uSSS = sss;
      shader.fragmentShader = shader.fragmentShader
        .replace('#include <common>', '#include <common>\nuniform vec3 uSSS;')
        .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
          {
            // псевдо-SSS: свет «расползается» внутри и сильнее виден у краёв
            float ndv = saturate( dot( normal, normalize( vViewPosition ) ) );
            totalEmissiveRadiance += uSSS * ( 0.12 + 0.9 * pow( 1.0 - ndv, 2.2 ) );
          }`);
    };
    this.materials.set(hex, m);
    return m;
  }

  setLevels(levels) {
    if (levels === this.levels) return;
    this.levels = levels;
    for (const v of this.views.values()) { this.scene.remove(v.mesh); v.dispose(); }
    this.views.clear();
  }

  // Синхронизация мешей со списком тел мира (новые куски → новые меши).
  sync(world) {
    const stamp = ++this._stamp;
    for (const b of world.bodies) {
      let v = this.views.get(b.id);
      if (!v) {
        v = new JellyView(b, this.material(b.color), this.levels);
        this.views.set(b.id, v);
        this.scene.add(v.mesh);
      } else v.update();
      v.stamp = stamp;
    }
    for (const [id, v] of this.views) {
      if (v.stamp !== stamp) { this.scene.remove(v.mesh); v.dispose(); this.views.delete(id); }
    }
  }

  pick(ray) {
    const o = ray.origin, d = ray.direction;
    let best = null;
    for (const v of this.views.values()) {
      if (v.body.dying > 0) continue;
      const t = v.surface.raycast(o.x, o.y, o.z, d.x, d.y, d.z);
      if (t < Infinity && (!best || t < best.t)) best = { t, body: v.body };
    }
    if (best) best.point = ray.at(best.t, new THREE.Vector3());
    return best;
  }

  bodiesHitBy(ray, set) {
    const o = ray.origin, d = ray.direction;
    for (const v of this.views.values()) {
      if (v.body.dying > 0 || set.has(v.body)) continue;
      if (v.surface.raycast(o.x, o.y, o.z, d.x, d.y, d.z) < Infinity) set.add(v.body);
    }
  }

  resize() {
    const w = window.innerWidth, h = window.innerHeight;
    this.camera.aspect = w / h;
    this.camera.updateProjectionMatrix();
    this.renderer.setSize(w, h);
  }

  render() { this.renderer.render(this.scene, this.camera); }
}

// ============================================================================
//  ВВОД: перетаскивание, разрез, камера. Обработчики регистрируются ДО
//  OrbitControls, поэтому при захвате желе мы успеваем выключить камеру.
//  Тянуть: ЛКМ/палец по желе — захват; по пустоте — вращение камеры.
//  Резать: ЛКМ/палец — линия разреза; камера: ПКМ/СКМ/колесо/два пальца.
// ============================================================================
class InputController {
  constructor(app) {
    this.app = app;
    this.canvas = app.view.domElement;
    this.mode = 'drag';
    this.active = null;
    this.pointers = new Set();
    this.raycaster = new THREE.Raycaster();
    this.ndc = new THREE.Vector2();
    this.dragPlane = new THREE.Plane();
    this.hover = { x: 0, y: 0, dirty: false, mouse: false };
    this.flashes = [];
    this.overlay = document.getElementById('overlay');
    this.ctx = this.overlay.getContext('2d');
    this.overlayDirty = true;
    this._resizeOverlay();
    window.addEventListener('resize', () => this._resizeOverlay());

    const c = this.canvas;
    c.addEventListener('pointerdown', (e) => this.onDown(e));
    c.addEventListener('pointermove', (e) => this.onMove(e));
    c.addEventListener('pointerup', (e) => this.onUp(e, false));
    c.addEventListener('pointercancel', (e) => this.onUp(e, true));
    c.addEventListener('lostpointercapture', (e) => { if (this.active && e.pointerId === this.active.id) this.onUp(e, true); });
    c.addEventListener('pointerleave', () => { this.hover.mouse = false; });
    c.addEventListener('wheel', (e) => this.onWheel(e), { passive: false });
  }

  _resizeOverlay() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    this.overlay.width = Math.round(window.innerWidth * dpr);
    this.overlay.height = Math.round(window.innerHeight * dpr);
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.overlayDirty = true;
  }

  rayAt(cx, cy) {
    const r = this.canvas.getBoundingClientRect();
    this.ndc.set(((cx - r.left) / r.width) * 2 - 1, -((cy - r.top) / r.height) * 2 + 1);
    this.raycaster.setFromCamera(this.ndc, this.app.camera);
    return this.raycaster.ray;
  }

  setMode(mode) {
    if (this.active) this.cancelActive();
    this.mode = mode;
    const ctl = this.app.controls;
    if (mode === 'cut') {
      ctl.mouseButtons = { LEFT: null, MIDDLE: THREE.MOUSE.PAN, RIGHT: THREE.MOUSE.ROTATE };
      ctl.touches = { ONE: null, TWO: THREE.TOUCH.DOLLY_ROTATE };
      this.canvas.style.cursor = 'crosshair';
    } else {
      ctl.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.PAN, RIGHT: THREE.MOUSE.ROTATE };
      ctl.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };
      this.canvas.style.cursor = '';
    }
  }

  onDown(e) {
    this.pointers.add(e.pointerId);
    if (this.active) {
      // второй палец во время разреза — это жест камеры, разрез отменяем
      if (this.active.kind === 'cut' && e.pointerType === 'touch') this.cancelActive();
      return;
    }
    if (this.pointers.size > 1) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    if (e.shiftKey || e.ctrlKey || e.metaKey) return;      // Shift+ЛКМ — панорама камеры

    if (this.mode === 'drag') {
      const hit = this.app.view.pick(this.rayAt(e.clientX, e.clientY));
      if (!hit) return;                                       // пустота → OrbitControls вращает
      this.app.controls.enabled = false;                      // OrbitControls проигнорирует это нажатие
      this.active = { kind: 'drag', id: e.pointerId, x: e.clientX, y: e.clientY };
      const dir = new THREE.Vector3();
      this.app.camera.getWorldDirection(dir);
      this.dragPlane.setFromNormalAndCoplanarPoint(dir, hit.point);
      this.app.world.startGrab(hit.body, hit.point.x, hit.point.y, hit.point.z);
      this.canvas.style.cursor = 'grabbing';
    } else {
      this.active = { kind: 'cut', id: e.pointerId, ax: e.clientX, ay: e.clientY, bx: e.clientX, by: e.clientY };
      this.overlayDirty = true;
    }
    try { this.canvas.setPointerCapture(e.pointerId); } catch (_) { /* ignore */ }
    e.preventDefault();
  }

  onMove(e) {
    if (e.pointerType === 'mouse') { this.hover.x = e.clientX; this.hover.y = e.clientY; this.hover.dirty = true; this.hover.mouse = true; }
    const a = this.active;
    if (!a || e.pointerId !== a.id) return;
    if (a.kind === 'drag') {
      a.x = e.clientX; a.y = e.clientY;
      this._updateDragTarget();
    } else {
      a.bx = e.clientX; a.by = e.clientY;
      this.overlayDirty = true;
    }
  }

  _updateDragTarget() {
    const a = this.active;
    const p = this.rayAt(a.x, a.y).intersectPlane(this.dragPlane, new THREE.Vector3());
    if (p) this.app.world.setGrabTarget(p.x, p.y, p.z);
  }

  onUp(e, cancelled) {
    this.pointers.delete(e.pointerId);
    const a = this.active;
    if (!a || e.pointerId !== a.id) return;
    this.active = null;
    if (a.kind === 'drag') {
      this.app.world.endGrab();
      this.canvas.style.cursor = '';
    } else if (!cancelled && Math.hypot(a.bx - a.ax, a.by - a.ay) >= 12) {
      this.app.performCut(a.ax, a.ay, a.bx, a.by);
    }
    this.app.controls.enabled = true;
    try { this.canvas.releasePointerCapture(e.pointerId); } catch (_) { /* ignore */ }
    this.overlayDirty = true;
  }

  cancelActive() {
    const a = this.active;
    if (!a) return;
    this.active = null;
    if (a.kind === 'drag') this.app.world.endGrab();
    this.app.controls.enabled = true;
    this.overlayDirty = true;
  }

  // Колесо во время захвата двигает желе к камере/от камеры.
  onWheel(e) {
    if (!this.active || this.active.kind !== 'drag') return;
    e.preventDefault();
    e.stopImmediatePropagation();
    this.dragPlane.constant += Math.sign(e.deltaY) * 0.25;
    this._updateDragTarget();
  }

  addFlash(ax, ay, bx, by, color) {
    this.flashes.push({ ax, ay, bx, by, t: 0.45, color });
    this.overlayDirty = true;
  }

  update(dt) {
    // подсветка курсора над желе (не чаще раза в кадр)
    if (this.mode === 'drag' && !this.active && this.hover.dirty && this.hover.mouse) {
      this.hover.dirty = false;
      const hit = this.app.view.pick(this.rayAt(this.hover.x, this.hover.y));
      this.canvas.style.cursor = hit ? 'grab' : '';
    }
    if (this.active && this.active.kind === 'drag') this._updateDragTarget();   // камера могла сместиться
    this._drawOverlay(dt);
  }

  _drawOverlay(dt) {
    if (!this.overlayDirty && !this.flashes.length) return;
    this.overlayDirty = false;
    const g = this.ctx;
    g.clearRect(0, 0, window.innerWidth, window.innerHeight);
    const a = this.active;
    if (a && a.kind === 'cut') {
      g.save();
      g.lineCap = 'round';
      g.shadowColor = 'rgba(255, 70, 140, 0.9)'; g.shadowBlur = 16;
      g.strokeStyle = 'rgba(255, 90, 150, 0.55)'; g.lineWidth = 9;
      g.beginPath(); g.moveTo(a.ax, a.ay); g.lineTo(a.bx, a.by); g.stroke();
      g.shadowBlur = 0; g.strokeStyle = '#ffffff'; g.lineWidth = 2.5; g.setLineDash([10, 7]);
      g.beginPath(); g.moveTo(a.ax, a.ay); g.lineTo(a.bx, a.by); g.stroke();
      g.setLineDash([]); g.fillStyle = '#fff';
      g.beginPath(); g.arc(a.ax, a.ay, 4, 0, Math.PI * 2); g.fill();
      g.restore();
    }
    for (let i = this.flashes.length - 1; i >= 0; i--) {
      const f = this.flashes[i];
      f.t -= dt;
      if (f.t <= 0) { this.flashes.splice(i, 1); continue; }
      const k = f.t / 0.45;
      g.save();
      g.globalAlpha = k;
      g.lineCap = 'round';
      g.shadowColor = f.color; g.shadowBlur = 24;
      g.strokeStyle = f.color; g.lineWidth = 3 + 10 * k;
      g.beginPath(); g.moveTo(f.ax, f.ay); g.lineTo(f.bx, f.by); g.stroke();
      g.shadowBlur = 0; g.strokeStyle = '#fff'; g.lineWidth = 2 * k;
      g.beginPath(); g.moveTo(f.ax, f.ay); g.lineTo(f.bx, f.by); g.stroke();
      g.restore();
    }
    if (this.flashes.length) this.overlayDirty = true;
  }
}

// ============================================================================
//  UI: панель, ползунки, подсказки, тосты
// ============================================================================
const SLIDERS = [
  { key: 'stiffness', label: 'Жёсткость', min: 0, max: 1, step: 0.01, fmt: (v) => `E≈${Math.round(ParamMap.E(v))}` },
  { key: 'volume', label: 'Сохранение объёма', min: 0, max: 1, step: 0.01, fmt: (v) => (v <= 0.001 ? 'выкл' : `κ=${ParamMap.kappa(v).toFixed(1)}`) },
  { key: 'damping', label: 'Демпфирование', min: 0, max: 50, step: 0.5, fmt: (v) => `τ=${v.toFixed(1)} мс` },
  { key: 'gravity', label: 'Гравитация', min: 0, max: 25, step: 0.1, fmt: (v) => `${v.toFixed(1)} м/с²` },
  { key: 'friction', label: 'Трение', min: 0, max: 1.5, step: 0.01, fmt: (v) => `μ=${v.toFixed(2)}` },
  { key: 'grab', label: 'Сила захвата', min: 0, max: 1, step: 0.01, fmt: (v) => `ω=${ParamMap.grabOmega(v).toFixed(0)} рад/с` },
  { key: 'substeps', label: 'Подшаги физики', min: 4, max: 30, step: 1, fmt: (v) => `${v} × 60 Гц` },
];

class UI {
  constructor(app) {
    this.app = app;
    this.$ = (id) => document.getElementById(id);
    this.touch = window.matchMedia('(pointer: coarse)').matches;
    this.sliderEls = {};

    const sel = this.$('shapeSelect');
    for (const [key, s] of Object.entries(SHAPES)) sel.add(new Option(s.label, key));
    sel.value = 'heart';

    const box = this.$('sliders');
    for (const s of SLIDERS) {
      const wrap = document.createElement('div');
      wrap.className = 'slider';
      wrap.innerHTML = `<div class="top"><span>${s.label}</span><span class="val"></span></div>
        <input type="range" min="${s.min}" max="${s.max}" step="${s.step}">`;
      const input = wrap.querySelector('input'), val = wrap.querySelector('.val');
      input.addEventListener('input', () => {
        const v = s.step >= 1 ? parseInt(input.value, 10) : parseFloat(input.value);
        app.world.params[s.key] = v;
        val.textContent = s.fmt(v);
      });
      this.sliderEls[s.key] = { input, val, s };
      box.appendChild(wrap);
    }
    this.syncSliders();

    this.$('modeSeg').addEventListener('click', (e) => {
      const b = e.target.closest('button[data-mode]');
      if (b) app.setMode(b.dataset.mode);
    });
    this.$('addBtn').addEventListener('click', () => app.addObject(sel.value));
    this.$('resetSceneBtn').addEventListener('click', () => app.resetScene());
    this.$('resetCamBtn').addEventListener('click', () => app.resetCamera());
    this.$('defaultsBtn').addEventListener('click', () => { Object.assign(app.world.params, DEFAULT_PARAMS); this.syncSliders(); });
    this.$('pauseChk').addEventListener('change', (e) => { app.world.paused = e.target.checked; });
    this.$('hqChk').addEventListener('change', (e) => app.view.setLevels(e.target.checked ? 2 : 1));
    this.$('collapse').addEventListener('click', () => this.$('panel').classList.toggle('collapsed'));
    if (window.innerWidth < 720) this.$('panel').classList.add('collapsed');

    window.addEventListener('keydown', (e) => {
      if (e.target instanceof HTMLInputElement || e.target instanceof HTMLSelectElement) return;
      const k = e.key.toLowerCase();
      if (k === '1') app.setMode('drag');
      else if (k === '2') app.setMode('cut');
      else if (k === 'r' || k === 'к') app.resetScene();
      else if (k === 'c' || k === 'с') app.resetCamera();
      else if (k === 'a' || k === 'ф') app.addObject(sel.value);
      else if (k === ' ') { e.preventDefault(); this.setPaused(!app.world.paused); }
    });
    this.fps = 60; this.physMs = 0; this.statTimer = 0;
  }

  syncSliders() {
    for (const { input, val, s } of Object.values(this.sliderEls)) {
      input.value = this.app.world.params[s.key];
      val.textContent = s.fmt(this.app.world.params[s.key]);
    }
  }

  setPaused(p) { this.app.world.paused = p; this.$('pauseChk').checked = p; this.toast(p ? '⏸ Пауза' : '▶ Продолжаем'); }

  setMode(mode) {
    for (const b of this.$('modeSeg').querySelectorAll('button')) b.classList.toggle('active', b.dataset.mode === mode);
    const badge = this.$('modeBadge');
    badge.textContent = mode === 'cut' ? '🔪 Режим резки' : '✋ Режим «Тянуть»';
    badge.classList.toggle('cut', mode === 'cut');
    const t = this.touch;
    const lines = {
      drag: t ? '<b>Палец по желе</b> — тянуть и бросать · <b>по фону</b> — вращать камеру · <b>два пальца</b> — зум и панорама'
              : '<b>ЛКМ по желе</b> — тянуть и бросать · <b>ЛКМ по фону / ПКМ</b> — вращать · <b>колесо</b> — зум (при захвате — глубина) · <b>СКМ / Shift+ЛКМ</b> — панорама',
      cut: t ? '<b>Проведите пальцем</b> через желе — разрез · <b>два пальца</b> — вращение и зум'
             : '<b>Проведите линию ЛКМ</b> через желе — разрез плоскостью · <b>ПКМ</b> — вращать · <b>колесо</b> — зум · <b>СКМ</b> — панорама',
    };
    this.$('hints').innerHTML = lines[mode] + (t ? '' : '<span class="keys">1 / 2 — режим · A — добавить · R — сброс сцены · C — камера · Пробел — пауза</span>');
  }

  toast(msg) {
    const el = this.$('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(this._toastT);
    this._toastT = setTimeout(() => el.classList.remove('show'), 1800);
  }

  updateStats(dt, physMs) {
    this.fps += ((1 / Math.max(dt, 1e-4)) - this.fps) * 0.05;
    this.physMs += (physMs - this.physMs) * 0.05;
    this.statTimer -= dt;
    if (this.statTimer > 0) return;
    this.statTimer = 0.25;
    const s = this.app.world.stats();
    this.$('stats').innerHTML =
      `FPS ${this.fps.toFixed(0)} · физика ${this.physMs.toFixed(1)} мс<br>` +
      `тел ${s.bodies} · частиц ${s.particles} · тетраэдров ${s.tets}`;
  }
}

// ============================================================================
//  ПРИЛОЖЕНИЕ
// ============================================================================
function randomRotation() {
  // случайный кватернион → матрица 3×3
  const u1 = Math.random(), u2 = Math.random() * Math.PI * 2, u3 = Math.random() * Math.PI * 2;
  const a = Math.sqrt(1 - u1), b = Math.sqrt(u1);
  const qx = a * Math.sin(u2), qy = a * Math.cos(u2), qz = b * Math.sin(u3), qw = b * Math.cos(u3);
  return [
    1 - 2 * (qy * qy + qz * qz), 2 * (qx * qy - qz * qw), 2 * (qx * qz + qy * qw),
    2 * (qx * qy + qz * qw), 1 - 2 * (qx * qx + qz * qz), 2 * (qy * qz - qx * qw),
    2 * (qx * qz - qy * qw), 2 * (qy * qz + qx * qw), 1 - 2 * (qx * qx + qy * qy),
  ];
}

function tiltRotation(ax, ay, az) {
  const e = new THREE.Euler(ax, ay, az), m = new THREE.Matrix4().makeRotationFromEuler(e).elements;
  return [m[0], m[4], m[8], m[1], m[5], m[9], m[2], m[6], m[10]];
}

class App {
  constructor() {
    this.world = new PhysicsWorld();
    this.view = new JellyRenderer(document.getElementById('app'));
    this.camera = this.view.camera;
    this.input = new InputController(this);             // до OrbitControls — порядок важен
    const c = this.controls = new OrbitControls(this.camera, this.view.domElement);
    c.enableDamping = true;
    c.dampingFactor = 0.08;
    c.target.copy(this.view.homeTarget);
    c.minDistance = 3;
    c.maxDistance = 24;
    c.maxPolarAngle = Math.PI * 0.485;
    c.screenSpacePanning = true;
    this.templates = new Map();
    this.ui = new UI(this);
    this.setMode('drag');
    this.camAnim = null;
    this.resetScene();
    this.last = performance.now();
    this.frame = this.frame.bind(this);
    requestAnimationFrame(this.frame);
  }

  template(shape) {
    let t = this.templates.get(shape);
    if (!t) { t = buildTetMesh(SHAPES[shape]); this.templates.set(shape, t); }
    return t;
  }

  spawn(shape, x, y, z, { color = SHAPES[shape].color, rot = randomRotation(), vel = [0, 0, 0] } = {}) {
    const tpl = this.template(shape), n = tpl.pos.length / 3, pos = new Float64Array(3 * n), v = new Float64Array(3 * n);
    let minY = Infinity;
    for (let i = 0; i < n; i++) {
      const px = tpl.pos[3 * i], py = tpl.pos[3 * i + 1], pz = tpl.pos[3 * i + 2];
      pos[3 * i] = rot[0] * px + rot[1] * py + rot[2] * pz + x;
      pos[3 * i + 1] = rot[3] * px + rot[4] * py + rot[5] * pz + y;
      pos[3 * i + 2] = rot[6] * px + rot[7] * py + rot[8] * pz + z;
      minY = Math.min(minY, pos[3 * i + 1]);
      v[3 * i] = vel[0]; v[3 * i + 1] = vel[1]; v[3 * i + 2] = vel[2];
    }
    const lift = Math.max(0, 0.25 - minY);
    for (let i = 0; i < n; i++) pos[3 * i + 1] += lift;
    return this.world.addBody(new SoftBody({ pos, rest: tpl.pos, vel: v, tets: tpl.tets, h: tpl.h, color, shape }));
  }

  resetScene() {
    this.input.cancelActive();
    this.world.clear();
    const layout = [
      ['cube', -1.7, 1.0, -0.5, [0.25, 0.4, 0.1]],
      ['sphere', 0.15, 2.4, -1.5, [0, 0, 0]],
      ['torus', 1.8, 1.4, -0.2, [0.5, 0.2, 0.3]],
      ['cylinder', -0.7, 3.1, 1.3, [0.3, 0, 0.5]],
      ['bear', 1.0, 3.6, 1.5, [-0.2, -0.5, 0.15]],
    ];
    for (const [shape, x, y, z, e] of layout) this.spawn(shape, x, y, z, { rot: tiltRotation(...e) });
    this.ui.toast('Сцена сброшена');
  }

  addObject(shape) {
    const s = this.world.stats(), tpl = this.template(shape);
    if (s.bodies >= MAX_BODIES || s.particles + tpl.pos.length / 3 > MAX_PARTICLES) {
      this.ui.toast('Слишком много желе — сбросьте сцену или порежьте поменьше');
      return;
    }
    // цвет: сначала «родной» цвет фигуры, иначе наименее используемый из палитры
    const used = new Map();
    for (const b of this.world.bodies) if (!b.dying) used.set(b.color, (used.get(b.color) || 0) + 1);
    let color = SHAPES[shape].color;
    if (used.has(color)) {
      let best = Infinity;
      for (const c of PALETTE) { const u = used.get(c) || 0; if (u < best) { best = u; color = c; } }
    }
    // место: самая свободная из нескольких случайных точек
    const centers = this.world.bodies.map((b) => b.center());
    let bx = 0, bz = 0, bestD = -1;
    for (let k = 0; k < 16; k++) {
      const a = Math.random() * Math.PI * 2, r = Math.sqrt(Math.random()) * 2.6;
      const x = Math.cos(a) * r, z = Math.sin(a) * r;
      let d = Infinity;
      for (const c of centers) d = Math.min(d, Math.hypot(c[0] - x, c[2] - z));
      if (d > bestD) { bestD = d; bx = x; bz = z; }
    }
    let top = 0;
    for (const c of centers) if (Math.hypot(c[0] - bx, c[2] - bz) < 1.4) top = Math.max(top, c[1]);
    this.spawn(shape, bx, Math.max(3.2, top + 2.0), bz, { color, vel: [0, -1, 0] });
    this.ui.toast(`${SHAPES[shape].label} добавлен`);
  }

  setMode(mode) {
    this.input.setMode(mode);
    this.ui.setMode(mode);
  }

  // Плоскость разреза: проходит через камеру и оба луча концов штриха.
  performCut(ax, ay, bx, by) {
    const ra = this.input.rayAt(ax, ay).clone(), rb = this.input.rayAt(bx, by).clone();
    const n = new THREE.Vector3().crossVectors(ra.direction, rb.direction);
    if (n.lengthSq() < 1e-12) return;
    n.normalize();
    const d = n.dot(ra.origin);
    // какие тела задеты штрихом: лучи по точкам вдоль линии
    const hit = new Set(), len = Math.hypot(bx - ax, by - ay), steps = Math.max(2, Math.ceil(len / 5));
    for (let s = 0; s <= steps; s++) {
      const t = s / steps;
      this.view.bodiesHitBy(this.input.rayAt(ax + (bx - ax) * t, ay + (by - ay) * t), hit);
    }
    if (!hit.size) {
      this.input.addFlash(ax, ay, bx, by, 'rgba(140, 140, 170, 0.8)');
      this.ui.toast('Мимо — линия не задела желе');
      return;
    }
    const res = this.world.cut([...hit], n.x, n.y, n.z, d);
    if (!res.cut) {
      this.input.addFlash(ax, ay, bx, by, 'rgba(140, 140, 170, 0.8)');
      this.ui.toast('Разрез прошёл по самому краю — нечего отрезать');
      return;
    }
    this.input.addFlash(ax, ay, bx, by, 'rgba(255, 70, 140, 0.95)');
    if (res.crumbs && !res.pieces) this.ui.toast('Слишком тонкий кусочек — растворился');
    else this.ui.toast(`Разрезано: ${res.cut} → кусков ${res.pieces}${res.crumbs ? ` (+${res.crumbs} крошки)` : ''}`);
  }

  resetCamera() {
    this.camAnim = { t: 0, p0: this.camera.position.clone(), t0: this.controls.target.clone() };
  }

  frame(now) {
    const dt = Math.min((now - this.last) / 1000, 0.1);
    this.last = now;
    const t0 = performance.now();
    this.world.advance(dt);
    const physMs = performance.now() - t0;
    this.view.sync(this.world);
    if (this.camAnim) {
      const a = this.camAnim;
      a.t = Math.min(a.t + dt / 0.8, 1);
      const k = a.t * a.t * (3 - 2 * a.t);
      this.camera.position.lerpVectors(a.p0, this.view.homePos, k);
      this.controls.target.lerpVectors(a.t0, this.view.homeTarget, k);
      if (a.t >= 1) this.camAnim = null;
    }
    // цель камеры не уходит далеко от тарелки
    const tg = this.controls.target, tr = Math.hypot(tg.x, tg.z);
    if (tr > 5) { tg.x *= 5 / tr; tg.z *= 5 / tr; }
    tg.y = clamp(tg.y, -0.5, 4);
    this.controls.update();
    this.input.update(dt);
    this.view.render();
    this.ui.updateStats(dt, physMs);
    requestAnimationFrame(this.frame);
  }
}

try {
  window.__jelly = new App();
  window.__jellyStarted = true;
  document.getElementById('loading').remove();
} catch (err) {
  console.error(err);
  document.getElementById('loadingText').textContent = 'Ошибка запуска: ' + err.message;
}
</script>
</body>
</html>
