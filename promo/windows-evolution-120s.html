<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Эволюция Windows</title>
<style>
  /* Layout: one 16:9 stage, letterboxed and scaled to the window.
     Visuals are drawn on a 1920x1080 logical canvas; HUD and overlay
     scale with --u (one logical pixel). Single dark look by design. */
  :root {
    --bg: #030406;
    --stage: #07080c;
    --ink: #eeeae3;
    --muted: #8d8996;
    --accent: #5fa8ff;
    --warm: #f3a35f;
    --u: 1px;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI Variable Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, Menlo, "Liberation Mono", "DejaVu Sans Mono", monospace;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); overflow: hidden; font-family: var(--sans); }
  #stage { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: var(--stage); overflow: hidden; user-select: none; -webkit-user-select: none; }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  #overlay {
    position: absolute; inset: 0; z-index: 2;
    display: grid; place-content: center; justify-items: center; gap: calc(var(--u) * 26);
    background: radial-gradient(ellipse at center, rgba(3, 4, 6, .45), rgba(3, 4, 6, .84));
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }
  #playBtn { display: grid; justify-items: center; gap: calc(var(--u) * 18); background: none; border: 0; color: var(--ink); cursor: pointer; font: inherit; padding: 0; }
  #playBtn .disc {
    width: max(72px, calc(var(--u) * 176)); aspect-ratio: 1; border-radius: 50%;
    display: grid; place-items: center; background: var(--accent); color: #04121f;
    box-shadow: 0 0 0 calc(var(--u) * 10) rgba(95, 168, 255, .15), 0 0 calc(var(--u) * 90) rgba(95, 168, 255, .45);
    transition: transform .2s ease, box-shadow .2s ease;
  }
  #playBtn:hover .disc { transform: scale(1.05); }
  #playBtn:focus-visible { outline: none; }
  #playBtn:focus-visible .disc { box-shadow: 0 0 0 4px var(--ink), 0 0 calc(var(--u) * 90) rgba(95, 168, 255, .55); }
  #playBtn svg { width: 38%; height: 38%; }
  #playLabel { font-size: max(15px, calc(var(--u) * 40)); font-weight: 650; letter-spacing: .02em; }
  .hint { margin: 0; font-size: max(11px, calc(var(--u) * 24)); color: var(--muted); letter-spacing: .12em; text-transform: uppercase; }

  #hud {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 3;
    display: flex; align-items: center; gap: max(8px, calc(var(--u) * 22));
    padding: max(6px, calc(var(--u) * 16)) max(16px, calc(var(--u) * 40)) max(8px, calc(var(--u) * 22));
    background: linear-gradient(to top, rgba(0, 0, 0, .6), rgba(0, 0, 0, 0));
    font-size: max(11px, calc(var(--u) * 22));
  }
  #timer { font-variant-numeric: tabular-nums; opacity: .85; white-space: nowrap; }
  #track { flex: 1; min-width: 0; height: max(3px, calc(var(--u) * 5)); background: rgba(255, 255, 255, .14); border-radius: 99px; overflow: hidden; }
  #bar { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--warm)); border-radius: inherit; }
  #muteBtn {
    flex: none; width: max(28px, calc(var(--u) * 46)); height: max(28px, calc(var(--u) * 46));
    display: grid; place-items: center; padding: 0; border: 0; border-radius: 50%;
    background: rgba(255, 255, 255, .08); color: var(--ink); cursor: pointer;
  }
  #muteBtn:hover { background: rgba(255, 255, 255, .16); }
  #muteBtn:focus-visible, #vol:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #muteBtn svg { width: 60%; height: 60%; }
  #vol { flex: none; width: max(64px, calc(var(--u) * 170)); accent-color: var(--accent); margin: 0; }
</style>

<div id="stage" role="region" aria-label="Эволюция Windows от MS-DOS до Windows 11, анимированное видео на 120 секунд">
  <canvas id="view" aria-hidden="true"></canvas>
  <div id="overlay">
    <button id="playBtn" type="button">
      <span class="disc">
        <svg id="playIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z" fill="currentColor"/></svg>
        <svg id="replayIcon" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z" fill="currentColor"/></svg>
      </span>
      <span id="playLabel">Смотреть</span>
    </button>
    <p class="hint" id="hint">Включите звук &middot; 120 секунд</p>
  </div>
  <div id="hud">
    <span id="timer">0:00 / 2:00</span>
    <div id="track" role="progressbar" aria-label="Прогресс воспроизведения" aria-valuemin="0" aria-valuemax="120" aria-valuenow="0"><div id="bar"></div></div>
    <button id="muteBtn" type="button" aria-label="Выключить звук" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>
        <path id="waves" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <path id="cross" d="M16 9l5 6M21 9l-5 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" hidden/>
      </svg>
    </button>
    <input id="vol" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Громкость">
  </div>
</div>

<script>
(() => {
  'use strict';

  /* =====================================================================
     TIMELINE: 0-6 intro · 13 versions x 8s (6-110) · 110-120 outro
     ===================================================================== */
  const W = 1920, H = 1080;
  const DURATION = 120, V_T0 = 6, V_DUR = 8, OUTRO_T0 = 110;
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const SANS = css('--sans') || 'system-ui, sans-serif';
  const MONO = css('--mono') || 'monospace';
  // Era fonts for the recreated interfaces (system fallbacks keep them safe).
  const F95 = '"MS Sans Serif", Tahoma, Verdana, Arial, sans-serif';
  const FXP = 'Tahoma, Verdana, Arial, sans-serif';
  const FSEG = '"Segoe UI Variable Text", "Segoe UI", ' + SANS;

  // Screen of the monitor (logical px); recreated UIs draw in 0..SW x 0..SH.
  const SX = 100, SY = 140, SW = 960, SH = 540;
  // Card and bullet timings (seconds after a version starts).
  const BUL_AT = [1.2, 1.9, 2.6], MEMO_AT = 3.6;

  const C = { ink: [238, 234, 227], muted: [141, 137, 150], accent: [95, 168, 255], warm: [243, 163, 95] };

  /* =====================================================================
     UTILITIES
     ===================================================================== */
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, p) => a + (b - a) * p;
  const prog = (t, a, b) => clamp((t - a) / (b - a));
  const eOut = p => 1 - Math.pow(1 - p, 3);
  const eIn = p => p * p * p;
  const eInOut = p => (p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
  const eBack = p => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
  const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
  const mix = (a, b, p) => [lerp(a[0], b[0], p), lerp(a[1], b[1], p), lerp(a[2], b[2], p)];
  const typed = (tau, t0, text, cps) => text.slice(0, clamp(Math.floor((tau - t0) * cps), 0, text.length));
  const blink = tau => Math.sin(tau * 8) > 0;
  function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const rng = mulberry32(1981);
  const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* =====================================================================
     DOM + CANVAS
     ===================================================================== */
  const $ = id => document.getElementById(id);
  const stage = $('stage'), canvas = $('view'), ctx = canvas.getContext('2d');
  const overlay = $('overlay'), playBtn = $('playBtn'), playLabel = $('playLabel');
  const timerEl = $('timer'), barEl = $('bar'), trackEl = $('track'), muteBtn = $('muteBtn'), volEl = $('vol');
  let scale = 1, posterT = 4.6;

  function fit() {
    const vw = window.innerWidth, vh = window.innerHeight;
    let w = vw, h = vw * 9 / 16;
    if (h > vh) { h = vh; w = vh * 16 / 9; }
    w = Math.max(1, Math.floor(w)); h = Math.max(1, Math.floor(h));
    stage.style.width = w + 'px'; stage.style.height = h + 'px';
    stage.style.setProperty('--u', (w / W) + 'px');
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    scale = canvas.width / W;
    if (!state.running) render(posterT);
  }

  const setLS = px => { if ('letterSpacing' in ctx) ctx.letterSpacing = px + 'px'; };
  let A = 1;
  const ga = x => { ctx.globalAlpha = clamp(A * x); };

  function rr(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath(); ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function glow(x, y, r, col, a) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, rgba(col, a)); g.addColorStop(1, rgba(col, 0));
    ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }
  function fitFont(text, weight, size, family, maxW) {
    ctx.font = `${weight} ${size}px ${family}`;
    const w = ctx.measureText(text).width;
    if (w > maxW) ctx.font = `${weight} ${Math.floor(size * maxW / w)}px ${family}`;
  }
  function wrap(text, maxW) {
    const words = text.split(' '), lines = []; let cur = '';
    for (const w of words) { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
    if (cur) lines.push(cur);
    return lines;
  }
  function txt(s, x, y, font, color, align = 'left', base = 'alphabetic') {
    ctx.font = font; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = base; ctx.fillText(s, x, y);
  }
  // Mouse pointer and keyframed pointer path.
  function cursor(x, y) {
    ctx.save(); ctx.translate(x, y);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 22); ctx.lineTo(5.5, 17); ctx.lineTo(9.5, 26); ctx.lineTo(13, 24.5); ctx.lineTo(9, 15.5); ctx.lineTo(16, 15.5); ctx.closePath();
    ctx.fillStyle = '#fff'; ctx.fill(); ctx.strokeStyle = '#000'; ctx.lineWidth = 1.3; ctx.stroke();
    ctx.restore();
  }
  function pathAt(tau, keys) {
    if (tau <= keys[0][0]) return [keys[0][1], keys[0][2]];
    for (let i = 0; i < keys.length - 1; i++) if (tau < keys[i + 1][0]) {
      const p = eInOut(prog(tau, keys[i][0], keys[i + 1][0]));
      return [lerp(keys[i][1], keys[i + 1][1], p), lerp(keys[i][2], keys[i + 1][2], p)];
    }
    const k = keys[keys.length - 1]; return [k[1], k[2]];
  }
  // Simple app icon: rounded square with an inner mark.
  function appIcon(x, y, s, color, mark = '#ffffff', r = 0.22) {
    rr(x, y, s, s, s * r); ctx.fillStyle = color; ctx.fill();
    ctx.fillStyle = mark; ctx.globalAlpha *= 0.85; rr(x + s * .28, y + s * .28, s * .44, s * .44, s * .08); ctx.fill(); ctx.globalAlpha /= 0.85;
  }
  function deskIcon(cx, y, label, color, font, textColor, shadow) {
    appIcon(cx - 20, y, 40, color);
    ctx.font = font; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    if (shadow) { ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillText(label, cx + 1, y + 47); }
    ctx.fillStyle = textColor; ctx.fillText(label, cx, y + 46);
    ctx.textBaseline = 'alphabetic';
  }

  /* =====================================================================
     ERA WIDGETS: windows, taskbars, start menus
     ===================================================================== */
  function bevel(x, y, w, h, inset = false, fill = '#c0c0c0') {
    ctx.fillStyle = fill; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = inset ? '#808080' : '#ffffff'; ctx.fillRect(x, y, w, 2); ctx.fillRect(x, y, 2, h);
    ctx.fillStyle = inset ? '#ffffff' : '#404040'; ctx.fillRect(x, y + h - 2, w, 2); ctx.fillRect(x + w - 2, y, 2, h);
  }
  // Windows 1.0 / 3.x style: centered title, solid bar.
  function win3(x, y, w, h, title, bar = '#000080') {
    ctx.fillStyle = '#c0c0c0'; ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
    ctx.fillStyle = bar; ctx.fillRect(x + 4, y + 4, w - 8, 22);
    bevel(x + 4, y + 4, 22, 22); ctx.fillStyle = '#000'; ctx.fillRect(x + 9, y + 14, 12, 3);
    bevel(x + w - 26, y + 4, 22, 22);
    txt(title, x + w / 2, y + 16, `700 14px ${F95}`, '#fff', 'center', 'middle');
    ctx.fillStyle = '#fff'; ctx.fillRect(x + 4, y + 27, w - 8, h - 31);
    ctx.textBaseline = 'alphabetic';
    return { x: x + 4, y: y + 27, w: w - 8, h: h - 31 };
  }
  // Windows 95/98/2000 style.
  function win9x(x, y, w, h, title, grad) {
    bevel(x, y, w, h);
    const g = ctx.createLinearGradient(x, 0, x + w, 0);
    g.addColorStop(0, '#000080'); g.addColorStop(1, grad ? '#1084d0' : '#000080');
    ctx.fillStyle = g; ctx.fillRect(x + 4, y + 4, w - 8, 22);
    txt(title, x + 10, y + 16, `700 14px ${F95}`, '#fff', 'left', 'middle');
    for (let k = 0; k < 3; k++) bevel(x + w - 26 - k * 20, y + 7, 17, 15);
    txt('×', x + w - 17.5, y + 15, `700 14px ${F95}`, '#000', 'center', 'middle');
    ctx.fillStyle = '#fff'; ctx.fillRect(x + 4, y + 30, w - 8, h - 34);
    ctx.textBaseline = 'alphabetic';
    return { x: x + 4, y: y + 30, w: w - 8, h: h - 34 };
  }
  function winXP(x, y, w, h, title) {
    rr(x, y, w, h, 8); ctx.fillStyle = '#0a4fd0'; ctx.fill();
    const g = ctx.createLinearGradient(0, y, 0, y + 30);
    g.addColorStop(0, '#3d8bff'); g.addColorStop(0.15, '#0a5ff0'); g.addColorStop(1, '#0349c9');
    ctx.save(); rr(x, y, w, 30, 8); ctx.clip(); ctx.fillStyle = g; ctx.fillRect(x, y, w, 30); ctx.restore();
    txt(title, x + 11, y + 20, `700 15px ${FXP}`, 'rgba(0,0,0,.4)'); txt(title, x + 10, y + 19, `700 15px ${FXP}`, '#fff');
    rr(x + w - 28, y + 5, 22, 21, 4); ctx.fillStyle = '#e2512c'; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.2; ctx.stroke();
    txt('×', x + w - 17, y + 16.5, `700 16px ${FXP}`, '#fff', 'center', 'middle');
    ctx.fillStyle = '#ece9d8'; ctx.fillRect(x + 4, y + 30, w - 8, h - 34);
    ctx.textBaseline = 'alphabetic';
    return { x: x + 4, y: y + 30, w: w - 8, h: h - 34 };
  }
  function winGlass(x, y, w, h, title) {
    rr(x, y, w, h, 8); ctx.fillStyle = 'rgba(160,195,230,0.5)'; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 1.2; ctx.stroke();
    const g = ctx.createLinearGradient(0, y, 0, y + 30); g.addColorStop(0, 'rgba(255,255,255,.45)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.save(); rr(x, y, w, h, 8); ctx.clip(); ctx.fillStyle = g; ctx.fillRect(x, y, w, 30); ctx.restore();
    txt(title, x + 12, y + 20, `400 14px ${FSEG}`, '#10202f');
    rr(x + w - 52, y + 1, 44, 19, 4); ctx.fillStyle = '#c94a3c'; ctx.fill();
    txt('×', x + w - 30, y + 11, `700 14px ${FSEG}`, '#fff', 'center', 'middle');
    ctx.fillStyle = '#fff'; ctx.fillRect(x + 8, y + 32, w - 16, h - 40);
    ctx.textBaseline = 'alphabetic';
    return { x: x + 8, y: y + 32, w: w - 16, h: h - 40 };
  }
  function tb95(items, pressed, quick) {
    const y = SH - 32;
    bevel(0, y, SW, 32);
    bevel(3, y + 4, 78, 24, pressed);
    ctx.fillStyle = '#000'; ctx.save(); ctx.translate(16, y + 16); ctx.rotate(Math.PI / 4); ctx.fillRect(-5, -5, 10, 10); ctx.restore();
    txt('Пуск', 28, y + 17, `700 14px ${F95}`, '#000', 'left', 'middle');
    let x = 88;
    if (quick) for (const c of quick) { appIcon(x, y + 7, 18, c); x += 24; }
    for (const [label, active] of items) { bevel(x + 4, y + 4, 170, 24, active); txt(label, x + 14, y + 17, `${active ? 700 : 400} 13px ${F95}`, '#000', 'left', 'middle'); x += 176; }
    bevel(SW - 74, y + 4, 70, 24, true);
    txt('12:00', SW - 39, y + 17, `400 13px ${F95}`, '#000', 'center', 'middle');
    ctx.textBaseline = 'alphabetic';
  }
  // Windows 95-style start menu.
  function menu95(p, hover, sub, banner) {
    if (p <= 0) return;
    const items = ['Программы', 'Документы', 'Настройка', 'Поиск', 'Справка', 'Выполнить...', 'Завершение работы...'];
    const mh = items.length * 36 + 14, mw = 236, y = SH - 32 - mh * p;
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, SW, SH - 32); ctx.clip();
    bevel(2, y, mw, mh);
    const g = ctx.createLinearGradient(0, y + mh, 0, y); g.addColorStop(0, '#000080'); g.addColorStop(1, '#1084d0');
    ctx.fillStyle = g; ctx.fillRect(5, y + 3, 26, mh - 6);
    ctx.save(); ctx.translate(24, y + mh - 12); ctx.rotate(-Math.PI / 2); txt(banner, 0, 0, `700 18px ${F95}`, '#fff'); ctx.restore();
    items.forEach((it, k) => {
      const iy = y + 7 + k * 36 + (k === 6 ? 6 : 0);
      if (k === 6) { ctx.fillStyle = '#808080'; ctx.fillRect(36, iy - 5, mw - 40, 1); ctx.fillStyle = '#fff'; ctx.fillRect(36, iy - 4, mw - 40, 1); }
      if (k === hover) { ctx.fillStyle = '#000080'; ctx.fillRect(34, iy, mw - 36, 34); }
      appIcon(42, iy + 6, 22, ['#c9a227', '#2e7dd1', '#7a7a7a', '#3b8a3b', '#b04040', '#555', '#333'][k]);
      txt(it, 74, iy + 18, `400 14px ${F95}`, k === hover ? '#fff' : '#000', 'left', 'middle');
      if (k < 3) txt('▸', mw - 14, iy + 18, `400 12px ${F95}`, k === hover ? '#fff' : '#000', 'center', 'middle');
    });
    if (sub > 0) {
      const sitems = ['Стандартные', 'Автозагрузка', 'Проводник', 'Сеанс MS-DOS'];
      const sx = mw + 2, sy = y + 7;
      ctx.globalAlpha *= sub; bevel(sx, sy, 200, sitems.length * 32 + 8);
      sitems.forEach((s, k) => { appIcon(sx + 10, sy + 9 + k * 32, 20, ['#c9a227', '#c9a227', '#d9b23a', '#222'][k]); txt(s, sx + 40, sy + 20 + k * 32, `400 14px ${F95}`, '#000', 'left', 'middle'); });
      ctx.globalAlpha /= sub;
    }
    ctx.restore(); ctx.textBaseline = 'alphabetic';
  }

  /* =====================================================================
     RECREATED INTERFACES, one per version (draw in screen-local coords)
     ===================================================================== */
  // --- MS-DOS ---
  const DOS_OUT = [' Том в устройстве C не имеет метки', ' Каталог C:\\', '', 'COMMAND  COM      25 307', 'AUTOEXEC BAT         128', 'CONFIG   SYS          96', 'GAMES        <DIR>', '        4 файл(ов)', ''];
  function mDOS(tau) {
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, SW, SH);
    ctx.font = `400 24px ${MONO}`; ctx.fillStyle = '#c8c8c8'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    const lh = 32; let row = 0, caret = null;
    const line = s => { ctx.fillText(s, 30, 52 + row * lh); row++; };
    if (tau > 0.35) line('Запуск MS-DOS...');
    if (tau > 0.55) line('');
    if (tau > 0.7) { const s = 'C:\\>' + typed(tau, 0.9, 'dir', 9); caret = [s, row]; line(s); }
    DOS_OUT.forEach((s, k) => { if (tau > 1.6 + k * 0.08) { line(s); caret = null; } });
    if (tau > 2.5) { const s = 'C:\\>' + typed(tau, 3.6, 'cd games', 11); caret = [s, row]; line(s); }
    if (tau > 4.6) { caret = ['C:\\GAMES>', row]; line('C:\\GAMES>'); }
    if (caret && blink(tau)) ctx.fillRect(30 + ctx.measureText(caret[0]).width + 2, 52 + caret[1] * lh + 4, 14, 4);
    ctx.fillStyle = 'rgba(0,0,0,0.28)'; for (let y = 0; y < SH; y += 4) ctx.fillRect(0, y, SW, 1.5);
  }

  // --- Windows 1.0: tiled windows ---
  function mW1(tau) {
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, SW, SH);
    const tile = (x, y, w, h, title, t0) => {
      const p = prog(tau, t0, t0 + 0.25); if (p <= 0) return null;

  function perc(g, at, peak, attack, decay) { g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(peak, at + attack); g.gain.exponentialRampToValueAtTime(0.0001, at + attack + decay); }

  function ambient(at, dur) {
    const end = at + dur, g = gainTo(bus.music);
    g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(0.04, at + 2); g.gain.setValueAtTime(0.04, end - 1.5); g.gain.linearRampToValueAtTime(0, end);
    const f = filt('lowpass', 460, 1.1); f.connect(g);
    const lfo = osc('sine', 0.06, at, end), amt = actx.createGain(); amt.gain.value = 200; lfo.connect(amt); amt.connect(f.frequency);
    [65.41, 98, 130.81].forEach(fr => [-7, 7].forEach(det => { const o = osc('sawtooth', fr, at, end); o.detune.value = det; o.connect(f); }));
  }
  function tick(at) { const g = gainTo(bus.sfx); perc(g, at, 0.05 + Math.random() * 0.025, 0.002, 0.03); const f = filt('bandpass', 2600 + Math.random() * 1800, 2.2); f.connect(g); noise(at, at + 0.05).connect(f); }
  function click(at) {
    const g = gainTo(bus.sfx); perc(g, at, 0.12, 0.001, 0.025); const f = filt('bandpass', 2200, 1.5); f.connect(g); noise(at, at + 0.04).connect(f);
    const g2 = gainTo(bus.sfx); perc(g2, at, 0.06, 0.002, 0.06); osc('sine', 190, at, at + 0.1).connect(g2);
  }
  function disk(at) { for (let k = 0; k < 7; k++) { const t0 = at + k * 0.07 + Math.random() * 0.02; const g = gainTo(bus.sfx); perc(g, t0, 0.07, 0.001, 0.03); const f = filt('bandpass', 900 + Math.random() * 600, 3); f.connect(g); noise(t0, t0 + 0.05).connect(f); } }
  function whoosh(at, dur) {
    const g = gainTo(bus.sfx); g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(0.13, at + dur * 0.55); g.gain.linearRampToValueAtTime(0, at + dur);
    const f = filt('bandpass', 300, 0.9); f.frequency.setValueAtTime(300, at); f.frequency.exponentialRampToValueAtTime(2400, at + dur * 0.55); f.frequency.exponentialRampToValueAtTime(500, at + dur);
    let out = g; if (actx.createStereoPanner) { const p = actx.createStereoPanner(); p.pan.setValueAtTime(0.7, at); p.pan.linearRampToValueAtTime(-0.5, at + dur); p.connect(g); out = p; }
    f.connect(out); noise(at, at + dur + 0.05).connect(f);
  }
  function pluck(at, freq, level = 0.05, type = 'triangle') { const g = gainTo(bus.sfx); perc(g, at, level, 0.004, 0.35); osc(type, freq, at, at + 0.45).connect(g); }
  function uacTone(at) { [523.25, 392].forEach((f, k) => { const g = gainTo(bus.sfx); perc(g, at + k * 0.16, 0.09, 0.01, 0.5); osc('triangle', f, at + k * 0.16, at + k * 0.16 + 0.6).connect(g); }); }
  function snap(at) { whoosh(at - 0.18, 0.28); click(at); }
  // Era-flavoured boot arpeggio: square for the early years, triangle for the 90s, sine pads later.
  const CHIMES = [[523.25, 659.25, 783.99, 1046.5], [392, 493.88, 587.33, 783.99], [440, 523.25, 659.25, 880], [349.23, 440, 523.25, 698.46]];
  function boot(i, at) {
    if (i === 0) { const g = gainTo(bus.sfx); perc(g, at, 0.05, 0.002, 0.14); const f = filt('lowpass', 3000); f.connect(g); osc('square', 1046.5, at, at + 0.2).connect(f); disk(at + 0.3); return; }
    const notes = CHIMES[i % 4], wave = i <= 3 ? 'square' : i <= 6 ? 'triangle' : 'sine';
    notes.forEach((fr, k) => {
      const t0 = at + k * 0.085, g = gainTo(bus.sfx); perc(g, t0, wave === 'square' ? 0.035 : wave === 'triangle' ? 0.06 : 0.07, 0.006, 1.1);
      const f = filt('lowpass', wave === 'square' ? 1800 : 5000); f.connect(g); osc(wave, fr, t0, t0 + 1.3).connect(f);
    });
    if (i >= 7) {
      const g = gainTo(bus.music); g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(0.05, at + 0.5); g.gain.linearRampToValueAtTime(0, at + 2);
      notes.slice(0, 3).forEach(fr => [-8, 8].forEach(det => { const o = osc('sine', fr / 2, at, at + 2.1); o.detune.value = det; o.connect(g); }));
    }
  }
  function kick(at) { const g = gainTo(bus.music); perc(g, at, 0.24, 0.003, 0.3); const o = osc('sine', 120, at, at + 0.4); o.frequency.exponentialRampToValueAtTime(42, at + 0.15); o.connect(g); }
  function hat(at) { const g = gainTo(bus.music); perc(g, at, 0.015, 0.002, 0.045); const f = filt('highpass', 7000, 0.7); f.connect(g); noise(at, at + 0.07).connect(f); }
  function chord(at, dur, freqs) {
    const g = gainTo(bus.music); g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(0.04, at + 0.4); g.gain.setValueAtTime(0.04, at + dur - 0.5); g.gain.linearRampToValueAtTime(0, at + dur);
    const f = filt('lowpass', 900, 0.6); f.connect(g);
    freqs.forEach(fr => [-6, 6].forEach(det => { const o = osc('triangle', fr, at, at + dur + 0.05); o.detune.value = det; o.connect(f); }));
    const b = gainTo(bus.music); b.gain.setValueAtTime(0, at); b.gain.linearRampToValueAtTime(0.08, at + 0.2); b.gain.setValueAtTime(0.08, at + dur - 0.4); b.gain.linearRampToValueAtTime(0, at + dur);
    osc('sine', freqs[0] / 2, at, at + dur + 0.05).connect(b);
  }
  function swell(at, dur) {
    const g = gainTo(bus.music); g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(0.12, at + dur); g.gain.linearRampToValueAtTime(0, at + dur + 0.06);
    const f = filt('lowpass', 200, 3); f.frequency.setValueAtTime(200, at); f.frequency.exponentialRampToValueAtTime(3600, at + dur); f.connect(g);
    [130.81, 196, 261.63].forEach(fr => { const o = osc('sawtooth', fr, at, at + dur + 0.1); o.frequency.exponentialRampToValueAtTime(fr * 1.335, at + dur); o.connect(f); });
  }
  function hit(at) {
    const kg = gainTo(bus.sfx); perc(kg, at, 0.85, 0.003, 0.6); const k = osc('sine', 140, at, at + 0.8); k.frequency.exponentialRampToValueAtTime(38, at + 0.35); k.connect(kg);
    const ng = gainTo(bus.sfx); perc(ng, at, 0.2, 0.003, 0.9); const nf = filt('lowpass', 3000, 0.7); nf.frequency.setValueAtTime(3000, at); nf.frequency.exponentialRampToValueAtTime(250, at + 0.8); nf.connect(ng); noise(at, at + 1).connect(nf);
    const sg = gainTo(bus.sfx); perc(sg, at, 0.1, 0.01, 2.2); [261.63, 329.63, 392, 523.25].forEach(fr => osc('triangle', fr, at, at + 2.4).connect(sg));
  }

  const PROG = [[261.63, 329.63, 392], [196, 246.94, 293.66], [220, 261.63, 329.63], [174.61, 220, 261.63]]; // C G Am F
  const EVENTS = [];
  const ev = (t, play) => EVENTS.push({ t, play });
  ev(0.6, at => { for (let k = 0; k < 3; k++) tick(at + k / 6); });
  ev(1.8, at => swell(at, 0.3));
  ev(1.95, at => boot(4, at));
  VERSIONS.forEach((_, k) => ev(3.4 + k * 0.08, at => pluck(at, 523.25 * Math.pow(2, k / 12), 0.03)));
  for (let t = V_T0, k = 0; t < OUTRO_T0; t += 4, k++) { const fr = PROG[k % 4]; ev(t, at => chord(at, 4.3, fr)); }
  for (let t = V_T0; t < OUTRO_T0; t += 1) { ev(t, at => kick(at)); ev(t + 0.5, at => hat(at)); }
  VERSIONS.forEach((v, i) => {
    const T = vStart(i);
    ev(T - 0.3, at => whoosh(at, 0.6));
    ev(T + 0.15, at => boot(i, at));
    BUL_AT.forEach((s, k) => ev(T + s, at => pluck(at, 880 + k * 110, 0.04, 'sine')));
    ev(T + MEMO_AT, at => pluck(at, 659.25, 0.04, 'sine'));
    v.sfx.forEach(([kind, s, n, step]) => {
      if (kind === 'type') for (let c = 0; c < n; c += 1) ev(T + s + c / step, at => tick(at));
      else if (kind === 'flips') for (let c = 0; c < n; c++) ev(T + s + c * step, at => tick(at));
      else if (kind === 'click') ev(T + s, at => click(at));
      else if (kind === 'disk') ev(T + s, at => disk(at));
      else if (kind === 'uac') ev(T + s, at => uacTone(at));
      else if (kind === 'snap') ev(T + s, at => snap(at));
    });
  });
  VERSIONS.forEach((_, k) => ev(OUTRO_T0 + 0.2 + k * 0.12, at => pluck(at, 523.25 * Math.pow(2, k / 12), 0.03)));
  ev(109.6, at => swell(at, 1.4));
  ev(111.0, at => hit(at));
  EVENTS.sort((a, b) => a.t - b.t);

  /* =====================================================================
     MASTER TIMELINE
     ===================================================================== */
  const state = { running: false, t0: 0, perf0: 0, next: 0 };
  const clock = () => (actx ? actx.currentTime - state.t0 : (performance.now() - state.perf0) / 1000);
  const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  function scheduleAudio(t) {
    if (!actx) return;
    while (state.next < EVENTS.length && EVENTS[state.next].t < t + 0.25) {
      const e = EVENTS[state.next++];
      if (e.t >= t - 0.05) e.play(state.t0 + e.t);
    }
  }
  function updateHUD(t) {
    barEl.style.width = (t / DURATION * 100) + '%';
    timerEl.textContent = `${fmt(Math.min(t, DURATION))} / ${fmt(DURATION)}`;
    trackEl.setAttribute('aria-valuenow', Math.floor(t));
  }
  function start() {
    if (state.running) return;
    state.running = true; overlay.hidden = true;
    initAudio(); state.next = 0;
    if (actx) {
      if (actx.state === 'suspended') actx.resume();
      if (bus) { const old = bus.run; old.gain.cancelScheduledValues(actx.currentTime); old.gain.setValueAtTime(0, actx.currentTime); setTimeout(() => old.disconnect(), 200); }
      bus = makeBuses();
      state.t0 = actx.currentTime + 0.15;
      ambient(state.t0, DURATION);
      bus.run.gain.setValueAtTime(1, state.t0 + 119); bus.run.gain.linearRampToValueAtTime(0.0001, state.t0 + DURATION);
    } else state.perf0 = performance.now() + 150;
    requestAnimationFrame(frame);
  }
  function frame() {
    const t = clock(), tc = clamp(t, 0, DURATION);
    scheduleAudio(t); render(tc); updateHUD(tc);
    if (t >= DURATION) { finish(); return; }
    requestAnimationFrame(frame);
  }
  function finish() {
    state.running = false; posterT = 114; render(posterT);
    playLabel.textContent = 'Ещё раз';
    $('playIcon').toggleAttribute('hidden', true); $('replayIcon').toggleAttribute('hidden', false);
    $('hint').textContent = 'Посмотреть снова';
    overlay.hidden = false; playBtn.focus({ preventScroll: true });
  }

  /* =====================================================================
     CONTROLS
     ===================================================================== */
  function applyVolume() {
    if (actx && master) master.gain.setTargetAtTime(effVol(), actx.currentTime, 0.03);
    muteBtn.setAttribute('aria-pressed', String(vol.muted));
    muteBtn.setAttribute('aria-label', vol.muted ? 'Включить звук' : 'Выключить звук');
    $('waves').toggleAttribute('hidden', vol.muted); $('cross').toggleAttribute('hidden', !vol.muted);
  }
  playBtn.addEventListener('click', start);
  muteBtn.addEventListener('click', () => { vol.muted = !vol.muted; applyVolume(); });
  volEl.addEventListener('input', () => { vol.level = parseFloat(volEl.value); if (vol.muted && vol.level > 0) vol.muted = false; applyVolume(); });
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', fit);
  fit();
  playBtn.focus({ preventScroll: true });
})();
</script>

</body>
