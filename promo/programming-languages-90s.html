<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Десять языков за 90 секунд</title>
<style>
  /* Layout: one 16:9 stage, letterboxed and scaled to the window.
     All visuals are drawn on a 1920x1080 logical canvas; the HUD and the
     overlay scale with --u (one logical pixel). Single dark look by design. */
  :root {
    --bg: #030406;
    --stage: #07080c;
    --ink: #eeeae3;
    --muted: #8d8996;
    --accent: #f3a35f;
    --ice: #a9c8ff;
    --u: 1px;
    --sans: ui-sans-serif, system-ui, -apple-system, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, "Liberation Mono", monospace;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); overflow: hidden; font-family: var(--sans); }

  #stage {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    background: var(--stage); overflow: hidden; user-select: none; -webkit-user-select: none;
  }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  #overlay {
    position: absolute; inset: 0; z-index: 2;
    display: grid; place-content: center; justify-items: center; gap: calc(var(--u) * 26);
    background: radial-gradient(ellipse at center, rgba(3, 4, 6, .45), rgba(3, 4, 6, .84));
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }
  #playBtn { display: grid; justify-items: center; gap: calc(var(--u) * 18); background: none; border: 0; color: var(--ink); cursor: pointer; font: inherit; padding: 0; }
  #playBtn .disc {
    width: max(72px, calc(var(--u) * 176)); aspect-ratio: 1; border-radius: 50%;
    display: grid; place-items: center; background: var(--accent); color: #1a1006;
    box-shadow: 0 0 0 calc(var(--u) * 10) rgba(243, 163, 95, .14), 0 0 calc(var(--u) * 90) rgba(243, 163, 95, .45);
    transition: transform .2s ease, box-shadow .2s ease;
  }
  #playBtn:hover .disc { transform: scale(1.05); }
  #playBtn:focus-visible { outline: none; }
  #playBtn:focus-visible .disc { box-shadow: 0 0 0 4px var(--ink), 0 0 calc(var(--u) * 90) rgba(243, 163, 95, .55); }
  #playBtn svg { width: 38%; height: 38%; }
  #playLabel { font-size: max(15px, calc(var(--u) * 40)); font-weight: 650; letter-spacing: .02em; }
  .hint { margin: 0; font-size: max(11px, calc(var(--u) * 24)); color: var(--muted); letter-spacing: .12em; text-transform: uppercase; }

  #hud {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 3;
    display: flex; align-items: center; gap: max(8px, calc(var(--u) * 22));
    padding: max(6px, calc(var(--u) * 16)) max(16px, calc(var(--u) * 40)) max(8px, calc(var(--u) * 22));
    background: linear-gradient(to top, rgba(0, 0, 0, .6), rgba(0, 0, 0, 0));
    font-size: max(11px, calc(var(--u) * 22));
  }
  #timer { font-variant-numeric: tabular-nums; opacity: .85; white-space: nowrap; }
  #track { flex: 1; min-width: 0; height: max(3px, calc(var(--u) * 5)); background: rgba(255, 255, 255, .14); border-radius: 99px; overflow: hidden; }
  #bar { height: 100%; width: 0; background: linear-gradient(90deg, var(--ice), var(--accent)); border-radius: inherit; }
  #muteBtn {
    flex: none; width: max(28px, calc(var(--u) * 46)); height: max(28px, calc(var(--u) * 46));
    display: grid; place-items: center; padding: 0; border: 0; border-radius: 50%;
    background: rgba(255, 255, 255, .08); color: var(--ink); cursor: pointer;
  }
  #muteBtn:hover { background: rgba(255, 255, 255, .16); }
  #muteBtn:focus-visible, #vol:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #muteBtn svg { width: 60%; height: 60%; }
  #vol { flex: none; width: max(64px, calc(var(--u) * 170)); accent-color: var(--accent); margin: 0; }
</style>

<div id="stage" role="region" aria-label="Десять языков программирования: сильные и слабые стороны, анимированное видео на 90 секунд">
  <canvas id="view" aria-hidden="true"></canvas>

  <div id="overlay">
    <button id="playBtn" type="button">
      <span class="disc">
        <svg id="playIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z" fill="currentColor"/></svg>
        <svg id="replayIcon" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z" fill="currentColor"/></svg>
      </span>
      <span id="playLabel">Смотреть</span>
    </button>
    <p class="hint" id="hint">Включите звук &middot; 90 секунд</p>
  </div>

  <div id="hud">
    <span id="timer">0:00 / 1:30</span>
    <div id="track" role="progressbar" aria-label="Прогресс воспроизведения" aria-valuemin="0" aria-valuemax="90" aria-valuenow="0"><div id="bar"></div></div>
    <button id="muteBtn" type="button" aria-label="Выключить звук" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>
        <path id="waves" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <path id="cross" d="M16 9l5 6M21 9l-5 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" hidden/>
      </svg>
    </button>
    <input id="vol" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Громкость">
  </div>
</div>

  /* =====================================================================
     UTILITIES
     ===================================================================== */
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, p) => a + (b - a) * p;
  const prog = (t, a, b) => clamp((t - a) / (b - a));
  const eOut = p => 1 - Math.pow(1 - p, 3);
  const eIn = p => p * p * p;
  const eInOut = p => (p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
  const eBack = p => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
  const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
  const mix = (a, b, p) => [lerp(a[0], b[0], p), lerp(a[1], b[1], p), lerp(a[2], b[2], p)];
  function mulberry32(a) {
    return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  }
  const rng = mulberry32(90);
  const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const langStart = i => LANG_T0 + i * LANG_DUR;

  /* =====================================================================
     DOM + CANVAS
     ===================================================================== */
  const $ = id => document.getElementById(id);
  const stage = $('stage'), canvas = $('view'), ctx = canvas.getContext('2d');
  const overlay = $('overlay'), playBtn = $('playBtn'), playLabel = $('playLabel');
  const timerEl = $('timer'), barEl = $('bar'), trackEl = $('track');
  const muteBtn = $('muteBtn'), volEl = $('vol');
  let scale = 1, posterT = 3.6;

  function fit() {
    const vw = window.innerWidth, vh = window.innerHeight;
    let w = vw, h = vw * 9 / 16;
    if (h > vh) { h = vh; w = vh * 16 / 9; }
    w = Math.max(1, Math.floor(w)); h = Math.max(1, Math.floor(h));
    stage.style.width = w + 'px'; stage.style.height = h + 'px';
    stage.style.setProperty('--u', (w / W) + 'px');
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    scale = canvas.width / W;
    if (!state.running) render(posterT);
  }

  const setLS = px => { if ('letterSpacing' in ctx) ctx.letterSpacing = px + 'px'; };
  let A = 1;                                           // scene alpha multiplier
  const ga = x => { ctx.globalAlpha = clamp(A * x); };

  function rr(x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function panel(x, y, w, h, r = 18) {
    rr(x, y, w, h, r);
    ctx.fillStyle = 'rgba(14,16,24,0.9)'; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.lineWidth = 1.5; ctx.stroke();
  }
  function glow(x, y, r, col, a) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, rgba(col, a)); g.addColorStop(1, rgba(col, 0));
    ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }
  function codeWindow(x, y, w, h, title) {
    panel(x, y, w, h);
    for (let i = 0; i < 3; i++) { ctx.fillStyle = 'rgba(255,255,255,0.16)'; ctx.beginPath(); ctx.arc(x + 30 + i * 24, y + 28, 6.5, 0, 7); ctx.fill(); }

    g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(0.1, at + dur * 0.8); g.gain.exponentialRampToValueAtTime(0.0001, at + dur + 0.1);
    const f = filt('lowpass', 180, 6); f.frequency.setValueAtTime(180, at); f.frequency.exponentialRampToValueAtTime(4800, at + dur * 0.85); f.connect(g);
    [-12, 0, 12].forEach(det => { const o = osc('sawtooth', 110, at, at + dur + 0.15); o.detune.value = det; o.frequency.exponentialRampToValueAtTime(220, at + dur); o.connect(f); });
  }
  function tick(at) {
    const g = gainTo(bus.sfx); perc(g, at, 0.05 + Math.random() * 0.025, 0.002, 0.03);
    const f = filt('bandpass', 2600 + Math.random() * 1800, 2.2); f.connect(g);
    noise(at, at + 0.05).connect(f);
  }
  function whoosh(at, dur) {
    const g = gainTo(bus.sfx);
    g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(0.14, at + dur * 0.55); g.gain.linearRampToValueAtTime(0, at + dur);
    const f = filt('bandpass', 300, 0.9);
    f.frequency.setValueAtTime(300, at); f.frequency.exponentialRampToValueAtTime(2400, at + dur * 0.55); f.frequency.exponentialRampToValueAtTime(500, at + dur);
    let out = g;
    if (actx.createStereoPanner) { const p = actx.createStereoPanner(); p.pan.setValueAtTime(0.7, at); p.pan.linearRampToValueAtTime(-0.5, at + dur); p.connect(g); out = p; }
    f.connect(out); noise(at, at + dur + 0.05).connect(f);
  }
  function pluck(at, freq, level = 0.06) {
    const g = gainTo(bus.sfx); perc(g, at, level, 0.004, 0.35);
    osc('triangle', freq, at, at + 0.45).connect(g);
  }
  // Rising two-note chime for a strength.
  function plusChime(at) {
    [[880, 0], [1318.5, 0.06]].forEach(([f, o]) => { const g = gainTo(bus.sfx); perc(g, at + o, 0.07, 0.004, 0.4); osc('sine', f, at + o, at + o + 0.5).connect(g); });
  }
  // Falling muted tone for a weakness.
  function minusTone(at) {
    const g = gainTo(bus.sfx); perc(g, at, 0.09, 0.006, 0.32);
    const f = filt('lowpass', 1100, 1); f.connect(g);
    const o = osc('triangle', 392, at, at + 0.4); o.frequency.exponentialRampToValueAtTime(247, at + 0.2); o.connect(f);
  }
  function kick(at, level = 0.28) {
    const g = gainTo(bus.music); perc(g, at, level, 0.003, 0.3);
    const o = osc('sine', 120, at, at + 0.4); o.frequency.exponentialRampToValueAtTime(42, at + 0.15); o.connect(g);
  }
  function hat(at) {
    const g = gainTo(bus.music); perc(g, at, 0.018, 0.002, 0.045);
    const f = filt('highpass', 7000, 0.7); f.connect(g); noise(at, at + 0.07).connect(f);
  }
  function chord(at, dur, freqs) {
    const g = gainTo(bus.music);
    g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(0.045, at + 0.4);
    g.gain.setValueAtTime(0.045, at + dur - 0.5); g.gain.linearRampToValueAtTime(0, at + dur);
    const f = filt('lowpass', 900, 0.6); f.connect(g);
    freqs.forEach(fr => [-6, 6].forEach(det => { const o = osc('triangle', fr, at, at + dur + 0.05); o.detune.value = det; o.connect(f); }));
    const b = gainTo(bus.music); b.gain.setValueAtTime(0, at); b.gain.linearRampToValueAtTime(0.09, at + 0.2);
    b.gain.setValueAtTime(0.09, at + dur - 0.4); b.gain.linearRampToValueAtTime(0, at + dur);
    osc('sine', freqs[0] / 2, at, at + dur + 0.05).connect(b);
  }
  function swell(at, dur) {
    const g = gainTo(bus.music);
    g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(0.13, at + dur); g.gain.linearRampToValueAtTime(0, at + dur + 0.06);
    const f = filt('lowpass', 200, 3); f.frequency.setValueAtTime(200, at); f.frequency.exponentialRampToValueAtTime(3600, at + dur); f.connect(g);
    [110, 164.81, 220].forEach(fr => { const o = osc('sawtooth', fr, at, at + dur + 0.1); o.frequency.exponentialRampToValueAtTime(fr * 1.335, at + dur); o.connect(f); });
  }
  function hit(at) {
    const kg = gainTo(bus.sfx); perc(kg, at, 0.85, 0.003, 0.6);
    const k = osc('sine', 140, at, at + 0.8); k.frequency.exponentialRampToValueAtTime(38, at + 0.35); k.connect(kg);
    const ng = gainTo(bus.sfx); perc(ng, at, 0.2, 0.003, 0.9);
    const nf = filt('lowpass', 3000, 0.7); nf.frequency.setValueAtTime(3000, at); nf.frequency.exponentialRampToValueAtTime(250, at + 0.8); nf.connect(ng);
    noise(at, at + 1).connect(nf);
    const sg = gainTo(bus.sfx); perc(sg, at, 0.1, 0.01, 1.3);
    [220, 261.63, 329.63, 440].forEach(fr => osc('triangle', fr, at, at + 1.4).connect(sg));
  }

  // Build the full event list once (time in seconds, play(at) on the audio clock).
  const PROG = [[220, 261.63, 329.63], [174.61, 220, 261.63], [196, 261.63, 329.63], [196, 246.94, 293.66]]; // Am F C G
  const PENTA = [440, 493.88, 554.37, 659.25, 739.99, 880, 987.77, 1108.73, 1318.51, 1479.98];
  const EVENTS = [];
  const ev = (t, play) => EVENTS.push({ t, play });
  ev(0.1, at => sweep(at, 1.6));
  LANGS.forEach((_, k) => ev(1.8 + k * 0.18, at => pluck(at, PENTA[k], 0.05)));
  ev(5.0, at => whoosh(at, 0.8));
  for (let t = LANG_T0, k = 0; t < OUTRO_T0; t += 4, k++) { const fr = PROG[k % 4]; ev(t, at => chord(at, 4.3, fr)); }
  for (let t = LANG_T0; t < OUTRO_T0; t += 1) { ev(t, at => kick(at)); ev(t + 0.5, at => hat(at)); }
  LANGS.forEach((L, i) => {
    const T = langStart(i);
    if (i > 0) ev(T - 0.3, at => whoosh(at, 0.6));
    L.ticks.forEach(s => ev(s, at => tick(at)));
    PRO_AT.forEach(s => ev(T + s, at => plusChime(at)));
    CON_AT.forEach(s => ev(T + s, at => minusTone(at)));
    L.best.forEach((_, k) => ev(T + CHIP_AT + k * CHIP_STEP, at => pluck(at, 1318.51 + k * 200, 0.03)));
  });
  LANGS.forEach((_, k) => ev(86.05 + k * 0.06, at => pluck(at, PENTA[k], 0.035)));
  ev(86.2, at => swell(at, 1.4));
  ev(87.6, at => hit(at));
  EVENTS.sort((a, b) => a.t - b.t);

  /* =====================================================================
     MASTER TIMELINE
     ===================================================================== */
  const state = { running: false, t0: 0, perf0: 0, next: 0 };
  const clock = () => (actx ? actx.currentTime - state.t0 : (performance.now() - state.perf0) / 1000);
  const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  const LOOKAHEAD = 0.25;

  function scheduleAudio(t) {
    if (!actx) return;
    while (state.next < EVENTS.length && EVENTS[state.next].t < t + LOOKAHEAD) {
      const e = EVENTS[state.next++];
      if (e.t >= t - 0.05) e.play(state.t0 + e.t);      // skip events missed while the tab was hidden
    }
  }
  function updateHUD(t) {
    barEl.style.width = (t / DURATION * 100) + '%';
    timerEl.textContent = `${fmt(Math.min(t, DURATION))} / ${fmt(DURATION)}`;
    trackEl.setAttribute('aria-valuenow', Math.floor(t));
  }

  function start() {
    if (state.running) return;
    state.running = true;
    overlay.hidden = true;
    initAudio();
    state.next = 0;
    if (actx) {
      if (actx.state === 'suspended') actx.resume();
      if (bus) { const old = bus.run; old.gain.cancelScheduledValues(actx.currentTime); old.gain.setValueAtTime(0, actx.currentTime); setTimeout(() => old.disconnect(), 200); }
      bus = makeBuses();
      state.t0 = actx.currentTime + 0.15;
      ambient(state.t0, DURATION);
      bus.run.gain.setValueAtTime(1, state.t0 + 89);      // fade out with the picture
      bus.run.gain.linearRampToValueAtTime(0.0001, state.t0 + DURATION);
    } else state.perf0 = performance.now() + 150;
    requestAnimationFrame(frame);
  }

  function frame() {
    const t = clock(), tc = clamp(t, 0, DURATION);
    scheduleAudio(t);
    render(tc); updateHUD(tc);
    if (t >= DURATION) { finish(); return; }
    requestAnimationFrame(frame);
  }

  function finish() {
    state.running = false;
    posterT = 88.6;
    render(posterT);
    playLabel.textContent = 'Ещё раз';
    $('playIcon').toggleAttribute('hidden', true); $('replayIcon').toggleAttribute('hidden', false);
    $('hint').textContent = 'Посмотреть снова';
    overlay.hidden = false;
    playBtn.focus({ preventScroll: true });
  }

  /* =====================================================================
     CONTROLS
     ===================================================================== */
  function applyVolume() {
    if (actx && master) master.gain.setTargetAtTime(effVol(), actx.currentTime, 0.03);
    muteBtn.setAttribute('aria-pressed', String(vol.muted));
    muteBtn.setAttribute('aria-label', vol.muted ? 'Включить звук' : 'Выключить звук');
    $('waves').toggleAttribute('hidden', vol.muted);
    $('cross').toggleAttribute('hidden', !vol.muted);
  }
  playBtn.addEventListener('click', start);
  muteBtn.addEventListener('click', () => { vol.muted = !vol.muted; applyVolume(); });
  volEl.addEventListener('input', () => {
    vol.level = parseFloat(volEl.value);
    if (vol.muted && vol.level > 0) vol.muted = false;
    applyVolume();
  });
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', fit);

  fit();
  playBtn.focus({ preventScroll: true });
})();
</script>

</body>
