<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>История видеоигр</title>
<style>
  /* Layout: one 16:9 stage, letterboxed and scaled to the window. A big
     game screen on the left plays each era live; facts sit on the right;
     a 1970-2015 timeline runs along the bottom. Single dark look by design. */
  :root {
    --bg: #030406;
    --stage: #08070c;
    --ink: #f0ece4;
    --muted: #8f8a99;
    --accent: #ffcc33;
    --hot: #ff5a5f;
    --u: 1px;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, Menlo, "Liberation Mono", "DejaVu Sans Mono", monospace;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); overflow: hidden; font-family: var(--sans); }
  #stage { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: var(--stage); overflow: hidden; user-select: none; -webkit-user-select: none; }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #overlay {
    position: absolute; inset: 0; z-index: 2;
    display: grid; place-content: center; justify-items: center; gap: calc(var(--u) * 26);
    background: radial-gradient(ellipse at center, rgba(3, 4, 6, .45), rgba(3, 4, 6, .84));
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }
  #playBtn { display: grid; justify-items: center; gap: calc(var(--u) * 18); background: none; border: 0; color: var(--ink); cursor: pointer; font: inherit; padding: 0; }
  #playBtn .disc {
    width: max(72px, calc(var(--u) * 176)); aspect-ratio: 1; border-radius: 50%;
    display: grid; place-items: center; background: var(--accent); color: #1d1500;
    box-shadow: 0 0 0 calc(var(--u) * 10) rgba(255, 204, 51, .15), 0 0 calc(var(--u) * 90) rgba(255, 204, 51, .45);
    transition: transform .2s ease, box-shadow .2s ease;
  }
  #playBtn:hover .disc { transform: scale(1.05); }
  #playBtn:focus-visible { outline: none; }
  #playBtn:focus-visible .disc { box-shadow: 0 0 0 4px var(--ink), 0 0 calc(var(--u) * 90) rgba(255, 204, 51, .55); }
  #playBtn svg { width: 38%; height: 38%; }
  #playLabel { font-size: max(15px, calc(var(--u) * 40)); font-weight: 650; letter-spacing: .02em; }
  .hint { margin: 0; font-size: max(11px, calc(var(--u) * 24)); color: var(--muted); letter-spacing: .12em; text-transform: uppercase; }
  #hud {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 3;
    display: flex; align-items: center; gap: max(8px, calc(var(--u) * 22));
    padding: max(6px, calc(var(--u) * 16)) max(16px, calc(var(--u) * 40)) max(8px, calc(var(--u) * 22));
    background: linear-gradient(to top, rgba(0, 0, 0, .6), rgba(0, 0, 0, 0));
    font-size: max(11px, calc(var(--u) * 22));
  }
  #timer { font-variant-numeric: tabular-nums; opacity: .85; white-space: nowrap; }
  #track { flex: 1; min-width: 0; height: max(3px, calc(var(--u) * 5)); background: rgba(255, 255, 255, .14); border-radius: 99px; overflow: hidden; }
  #bar { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--hot)); border-radius: inherit; }
  #muteBtn {
    flex: none; width: max(28px, calc(var(--u) * 46)); height: max(28px, calc(var(--u) * 46));
    display: grid; place-items: center; padding: 0; border: 0; border-radius: 50%;
    background: rgba(255, 255, 255, .08); color: var(--ink); cursor: pointer;
  }
  #muteBtn:hover { background: rgba(255, 255, 255, .16); }
  #muteBtn:focus-visible, #vol:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #muteBtn svg { width: 60%; height: 60%; }
  #vol { flex: none; width: max(64px, calc(var(--u) * 170)); accent-color: var(--accent); margin: 0; }
</style>

<div id="stage" role="region" aria-label="История видеоигр от Pong до Minecraft, анимированное видео на 45 секунд">
  <canvas id="view" aria-hidden="true"></canvas>
  <div id="overlay">
    <button id="playBtn" type="button">
      <span class="disc">
        <svg id="playIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z" fill="currentColor"/></svg>
        <svg id="replayIcon" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z" fill="currentColor"/></svg>
      </span>
      <span id="playLabel">Смотреть</span>
    </button>
    <p class="hint" id="hint">Включите звук &middot; 45 секунд</p>
  </div>
  <div id="hud">
    <span id="timer">0:00 / 0:45</span>
    <div id="track" role="progressbar" aria-label="Прогресс воспроизведения" aria-valuemin="0" aria-valuemax="45" aria-valuenow="0"><div id="bar"></div></div>
    <button id="muteBtn" type="button" aria-label="Выключить звук" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>
        <path id="waves" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <path id="cross" d="M16 9l5 6M21 9l-5 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" hidden/>
      </svg>
    </button>
    <input id="vol" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Громкость">
  </div>
</div>

<script>
(() => {
  'use strict';

  /* =====================================================================
     TIMELINE: 0-3 intro · 6 games x 6s (3-39) · 39-45 outro
     ===================================================================== */
  const W = 1920, H = 1080;
  const DURATION = 45, G_T0 = 3, G_DUR = 6, OUTRO_T0 = 39;
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const SANS = css('--sans') || 'system-ui, sans-serif';
  const MONO = css('--mono') || 'monospace';
  // Game screen (logical px); each game draws in 0..VW x 0..VH.
  const VX = 100, VY = 140, VW = 1100, VH = 620;
  const FACT_AT = [1.0, 1.6];
  const C = { ink: [240, 236, 228], muted: [143, 138, 153], accent: [255, 204, 51], hot: [255, 90, 95] };

  /* =====================================================================
     UTILITIES
     ===================================================================== */
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, p) => a + (b - a) * p;
  const prog = (t, a, b) => clamp((t - a) / (b - a));
  const eOut = p => 1 - Math.pow(1 - p, 3);
  const eIn = p => p * p * p;
  const eInOut = p => (p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
  const eBack = p => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
  const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
  const mix = (a, b, p) => [lerp(a[0], b[0], p), lerp(a[1], b[1], p), lerp(a[2], b[2], p)];
  const refl = (p, a, b) => { const L = b - a, m = ((p - a) % (2 * L) + 2 * L) % (2 * L); return a + (m <= L ? m : 2 * L - m); };
  function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const rng = mulberry32(1972);
  const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* =====================================================================
     DOM + CANVAS
     ===================================================================== */
  const $ = id => document.getElementById(id);
  const stage = $('stage'), canvas = $('view'), ctx = canvas.getContext('2d');
  const overlay = $('overlay'), playBtn = $('playBtn'), playLabel = $('playLabel');
  const timerEl = $('timer'), barEl = $('bar'), trackEl = $('track'), muteBtn = $('muteBtn'), volEl = $('vol');
  let scale = 1, posterT = 2.2;

  function fit() {
    const vw = window.innerWidth, vh = window.innerHeight;
    let w = vw, h = vw * 9 / 16;
    if (h > vh) { h = vh; w = vh * 16 / 9; }
    w = Math.max(1, Math.floor(w)); h = Math.max(1, Math.floor(h));
    stage.style.width = w + 'px'; stage.style.height = h + 'px';
    stage.style.setProperty('--u', (w / W) + 'px');
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    scale = canvas.width / W;
    if (!state.running) render(posterT);
  }
  const setLS = px => { if ('letterSpacing' in ctx) ctx.letterSpacing = px + 'px'; };
  let A = 1;
  const ga = x => { ctx.globalAlpha = clamp(A * x); };
  function rr(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath(); ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function glow(x, y, r, col, a) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, rgba(col, a)); g.addColorStop(1, rgba(col, 0));
    ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }
  function txt(s, x, y, font, color, align = 'left', base = 'alphabetic') {
    ctx.font = font; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = base; ctx.fillText(s, x, y);
  }
  function fitFont(text, weight, size, family, maxW) {
    ctx.font = `${weight} ${size}px ${family}`;
    const w = ctx.measureText(text).width;
    if (w > maxW) ctx.font = `${weight} ${Math.floor(size * maxW / w)}px ${family}`;
  }
  function wrap(text, maxW) {
    const words = text.split(' '), lines = []; let cur = '';
    for (const w of words) { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
    if (cur) lines.push(cur);
    return lines;
  }
  // Pixel sprite from strings; '.' is transparent.
  function sprite(rows, pal, x, y, px, flip = false) {
    rows.forEach((row, j) => {
      for (let i = 0; i < row.length; i++) {
        const ch = row[flip ? row.length - 1 - i : i]; if (ch === '.') continue;
        ctx.fillStyle = pal[ch]; ctx.fillRect(Math.round(x + i * px), Math.round(y + j * px), px, px);
      }
    });
  }
  function pathAt(tau, keys) {
    if (tau <= keys[0][0]) return keys[0].slice(1);
    for (let i = 0; i < keys.length - 1; i++) if (tau < keys[i + 1][0]) {
      const p = eInOut(prog(tau, keys[i][0], keys[i + 1][0]));
      return keys[i].slice(1).map((v, k) => lerp(v, keys[i + 1][k + 1], p));
    }
    return keys[keys.length - 1].slice(1);
  }
  function scanlines(a = 0.22) { ctx.fillStyle = `rgba(0,0,0,${a})`; for (let y = 0; y < VH; y += 4) ctx.fillRect(0, y, VW, 1.5); }

  /* =====================================================================
     GAME 1 · PONG (1972): two paddles and a square ball
     ===================================================================== */
  const PONG = { L: 78, R: VW - 98, T: 20, B: VH - 40, x0: VW / 2, y0: 150, vx: 760, vy: 520 };
  const pongX = tau => refl(PONG.x0 + PONG.vx * tau, PONG.L, PONG.R);
  const pongY = tau => refl(PONG.y0 + PONG.vy * tau, PONG.T, PONG.B);
  const PONG_PADDLE = [], PONG_WALL = [];
  {
    const Lx = PONG.R - PONG.L, Ly = PONG.B - PONG.T;
    for (let k = 0; k < 6; k++) { const tr = (PONG.R - PONG.x0) / PONG.vx + 2 * k * Lx / PONG.vx; PONG_PADDLE.push(tr, tr + Lx / PONG.vx); }
    for (let k = 0; k < 8; k++) { const tb = (PONG.B - PONG.y0) / PONG.vy + 2 * k * Ly / PONG.vy; PONG_WALL.push(tb, tb + Ly / PONG.vy); }
  }
  function gPong(tau) {
    ctx.fillStyle = '#050505'; ctx.fillRect(0, 0, VW, VH);
    ctx.fillStyle = '#e8e8e8';
    for (let y = 10; y < VH; y += 40) ctx.fillRect(VW / 2 - 5, y, 10, 22);
    const score = n => String(n);
    txt(score(tau > 4.6 ? 4 : 3), VW / 2 - 120, 110, `700 90px ${MONO}`, '#e8e8e8', 'center');
    txt(score(2), VW / 2 + 120, 110, `700 90px ${MONO}`, '#e8e8e8', 'center');
    const ly = clamp(pongY(tau - 0.12) - 45, 10, VH - 120), ry = clamp(pongY(tau - 0.09) - 45, 10, VH - 120);
    ctx.fillRect(56, ly, 20, 110); ctx.fillRect(VW - 76, ry, 20, 110);
    ctx.fillRect(pongX(tau), pongY(tau), 20, 20);
    scanlines();
  }

  /* =====================================================================
     GAME 2 · SPACE INVADERS (1978): a marching formation that speeds up
     as it shrinks (original pixel art, not the arcade sprites)
     ===================================================================== */
  const ALIENS = [
    [['..X..X..', '...XX...', '..XXXX..', '.X.XX.X.', 'XXXXXXXX', 'X.X..X.X'], ['..X..X..', '...XX...', '..XXXX..', '.X.XX.X.', 'XXXXXXXX', '.X....X.']],
    [['...XX...', '..XXXX..', '.XXXXXX.', 'XX.XX.XX', 'XXXXXXXX', '..X..X..'], ['...XX...', '..XXXX..', '.XXXXXX.', 'XX.XX.XX', 'XXXXXXXX', '.X.XX.X.']],
    [['.XXXXXX.', 'XXXXXXXX', 'XX.XX.XX', 'XXXXXXXX', '.X.XX.X.', 'X......X'], ['.XXXXXX.', 'XXXXXXXX', 'XX.XX.XX', 'XXXXXXXX', '.X.XX.X.', '..X..X..']]
  ];
  const INV = { rows: 5, cols: 9, sx: 84, sy: 62, px: 7, left: 60, top: 70 };
  const SHOTS = [[0.9, 4, 2], [1.8, 4, 6], [2.7, 3, 4], [3.6, 4, 4], [4.5, 2, 1]];   // [time, row, col]
  const HIT_DT = 0.35;
  const KILL_T = SHOTS.map(s => s[0] + HIT_DT);
  const INV_STEPS = [];
  {
    let t = 0.3, x = 0, y = 0, dir = 1;
    const maxX = VW - INV.left * 2 - INV.cols * INV.sx + 28;
    while (t < 6.3) {
      INV_STEPS.push([t, x, y]);
      const killed = KILL_T.filter(k => k <= t).length;
      const nx = x + dir * 20;
      if (nx > maxX || nx < 0) { y += 24; dir = -dir; } else x = nx;
      t += 0.4 - killed * 0.055;
    }
  }
  function formAt(tau) { let k = 0; while (k + 1 < INV_STEPS.length && INV_STEPS[k + 1][0] <= tau) k++; return [INV_STEPS[k][1], INV_STEPS[k][2], k]; }
  const alienPos = (r, c, tau) => { const [fx, fy] = formAt(tau); return [INV.left + fx + c * INV.sx, INV.top + fy + r * INV.sy]; };
  const PLAYER_KEYS = [[0, VW / 2, 0]];
  SHOTS.forEach(([ts, r, c]) => { const x = alienPos(r, c, ts + HIT_DT)[0] + 28; PLAYER_KEYS.push([ts - 0.08, x, 0], [ts + 0.12, x, 0]); });
  function gInvaders(tau) {
    ctx.fillStyle = '#04060a'; ctx.fillRect(0, 0, VW, VH);
    const [, , step] = formAt(tau), frame = step % 2;
    for (let r = 0; r < INV.rows; r++) for (let c = 0; c < INV.cols; c++) {
      const si = SHOTS.findIndex(s => s[1] === r && s[2] === c);
      if (si >= 0 && tau >= KILL_T[si] + 0.25) continue;
      const [x, y] = alienPos(r, c, tau);
      if (si >= 0 && tau >= KILL_T[si]) {
        ctx.fillStyle = '#ffffff';
        for (let k = 0; k < 10; k++) { const a = k * 0.63, d = 10 + prog(tau, KILL_T[si], KILL_T[si] + 0.25) * 26; ctx.fillRect(x + 28 + Math.cos(a) * d, y + 20 + Math.sin(a) * d, 6, 6); }
        continue;
      }
      const type = r === 0 ? 2 : r < 3 ? 1 : 0;
      ctx.fillStyle = ['#7dff8a', '#5fd6ff', '#ff7ad9'][type];
      sprite(ALIENS[type][frame], { X: ['#7dff8a', '#5fd6ff', '#ff7ad9'][type] }, x, y, INV.px);
    }
    const [plx] = pathAt(tau, PLAYER_KEYS), ply = VH - 70;
    sprite(['.....X.....', '....XXX....', '.XXXXXXXXX.', 'XXXXXXXXXXX', 'XXXXXXXXXXX'], { X: '#7dff8a' }, plx - 33, ply, 6);
    SHOTS.forEach(([ts, r, c], k) => {
      if (tau < ts || tau > KILL_T[k]) return;
      const [, ay] = alienPos(r, c, KILL_T[k]);
      const p = prog(tau, ts, KILL_T[k]), sx = alienPos(r, c, KILL_T[k])[0] + 28;
      ctx.fillStyle = '#ffffff'; ctx.fillRect(sx - 2, lerp(ply - 10, ay + 30, p), 4, 22);
    });
    ctx.fillStyle = '#7dff8a'; ctx.fillRect(0, VH - 30, VW, 3);
    txt(`ОЧКИ ${String(KILL_T.filter(k => k <= tau).length * 30).padStart(4, '0')}`, 30, 46, `700 26px ${MONO}`, '#ffffff');
    scanlines();
  }

  /* =====================================================================
     GAME 3 · TETRIS (1984): three pieces land, an I-piece clears 4 lines
     ===================================================================== */
  const TCOL = { I: '#3ad7f0', O: '#f5d33b', T: '#b05ce6', S: '#5cd65c', Z: '#ef5350', J: '#4a7ff0', L: '#f59a3b' };
  const TB = { x: 300, y: 25, cell: 28, cols: 10, rows: 20 };
  const STACK = [];
  {
    const keys = Object.keys(TCOL);
    for (let r = 16; r < 20; r++) for (let c = 0; c < 9; c++) STACK.push([r, c, TCOL[keys[Math.floor(rng() * keys.length)]]]);
    for (let c = 0; c < 4; c++) STACK.push([15, c, TCOL[keys[Math.floor(rng() * keys.length)]]]);
  }
  const PIECES = [
    { cells: [[14, 4], [14, 5], [15, 4], [15, 5]], color: TCOL.O, t0: 0.35, t1: 1.2, shift: 0 },
    { cells: [[14, 7], [15, 6], [15, 7], [15, 8]], color: TCOL.T, t0: 1.3, t1: 2.1, shift: -3 },
    { cells: [[13, 0], [14, 0], [14, 1], [14, 2]], color: TCOL.J, t0: 2.2, t1: 3.0, shift: 4 },
    { cells: [[16, 9], [17, 9], [18, 9], [19, 9]], color: TCOL.I, t0: 3.15, t1: 4.0, shift: -5 }
  ];
  const CLEAR_T = 4.0, GONE_T = 4.35, FALL_T = 4.55;
  function tCell(x, y, color, a = 1) {
    const s = TB.cell;
    ctx.globalAlpha *= a;
    ctx.fillStyle = color; ctx.fillRect(x, y, s, s);
    ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(x, y, s, 4); ctx.fillRect(x, y, 4, s);
    ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(x, y + s - 4, s, 4); ctx.fillRect(x + s - 4, y, 4, s);
    ctx.globalAlpha /= a;
  }
  function gTetris(tau) {
    const g = ctx.createLinearGradient(0, 0, 0, VH); g.addColorStop(0, '#0b1030'); g.addColorStop(1, '#1a0b2e');
    ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
    const s = TB.cell, bw = s * TB.cols, bh = s * TB.rows;
    ctx.fillStyle = '#05060f'; ctx.fillRect(TB.x - 6, TB.y - 6, bw + 12, bh + 12);
    ctx.strokeStyle = 'rgba(255,255,255,0.05)'; ctx.lineWidth = 1;
    for (let c = 1; c < TB.cols; c++) { ctx.beginPath(); ctx.moveTo(TB.x + c * s, TB.y); ctx.lineTo(TB.x + c * s, TB.y + bh); ctx.stroke(); }
    const cleared = tau >= GONE_T, drop = cleared ? 4 * s * eOut(prog(tau, GONE_T, FALL_T)) : 0;
    const flash = tau >= CLEAR_T && tau < GONE_T && Math.sin((tau - CLEAR_T) * 40) > 0;
    const drawCell = (r, c, color) => {
      if (r >= 16) { if (cleared) return; if (flash) { ctx.fillStyle = '#fff'; ctx.fillRect(TB.x + c * s, TB.y + r * s, s, s); return; } }
      tCell(TB.x + c * s, TB.y + r * s + (r < 16 ? drop : 0), color);
    };
    STACK.forEach(([r, c, col]) => drawCell(r, c, col));
    PIECES.forEach(p => {
      if (tau < p.t0) return;
      if (tau >= p.t1) { p.cells.forEach(([r, c]) => drawCell(r, c, p.color)); return; }
      const minR = Math.min(...p.cells.map(q => q[0])), D = minR + 2;
      const pr = prog(tau, p.t0, p.t1), off = D - Math.floor(D * pr), sh = Math.round(p.shift * (1 - clamp(pr * 2.5)));
      p.cells.forEach(([r, c]) => { const rr2 = r - off; if (rr2 >= 0) tCell(TB.x + (c + sh) * s, TB.y + rr2 * s, p.color); });
    });
    // side panel
    const px = TB.x + bw + 50;
    txt('СЛЕДУЮЩАЯ', px, 70, `700 22px ${MONO}`, '#cfd3ff');
    ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.strokeRect(px, 86, 170, 120);
    const next = PIECES.find(p => tau < p.t0) || PIECES[3];
    const nc = next.cells.map(([r, c]) => [r - Math.min(...next.cells.map(q => q[0])), c - Math.min(...next.cells.map(q => q[1]))]);
    nc.forEach(([r, c]) => tCell(px + 30 + c * s, 104 + r * s * (next === PIECES[3] ? 0.7 : 1), next.color));

      head = lerp(cur > 0 ? GAMES[cur - 1].year : TL.from, GAMES[cur].year, eInOut(prog(t - gStart(cur), -0.3, 0.5)));
    } else if (t >= OUTRO_T0) head = lerp(TL.from, TL.to, eInOut(prog(t, OUTRO_T0, OUTRO_T0 + 1.8)));
    if (t >= G_T0 - 0.3) {
      const hx = yearX(head), pg = ctx.createLinearGradient(TL.x0, 0, hx, 0);
      pg.addColorStop(0, rgba(C.accent, 0.2)); pg.addColorStop(1, rgba(cur >= 0 ? GAMES[cur].accent : C.accent, 1));
      ctx.globalAlpha = 1; ctx.fillStyle = pg; ctx.fillRect(TL.x0, TL.y - 1.5, hx - TL.x0, 3);
    }
    GAMES.forEach((g, i) => {
      const x = yearX(g.year), ap = prog(t, 1.8 + i * 0.08, 2.1 + i * 0.08); if (ap <= 0) return;
      const reached = t >= G_T0 - 0.3 && yearX(head) >= x - 0.5, active = i === cur;
      ctx.globalAlpha = ap;
      if (active) glow(x, TL.y, 34, g.accent, 0.5);
      ctx.beginPath(); ctx.arc(x, TL.y, active ? 9 : 6, 0, 7);
      if (reached) { ctx.fillStyle = rgba(g.accent, 1); ctx.fill(); }
      else { ctx.fillStyle = '#0d0c12'; ctx.fill(); ctx.strokeStyle = rgba(g.accent, 0.6); ctx.lineWidth = 2; ctx.stroke(); }
      if (active) txt(g.name, x, TL.y - 22, `700 20px ${SANS}`, rgba(g.accent, 1), 'center');
      if (outro > 0) { ctx.globalAlpha = eOut(prog(t, OUTRO_T0 + 0.2 + i * 0.15, OUTRO_T0 + 0.6 + i * 0.15)); txt(g.name, x, i % 2 ? TL.y + 40 : TL.y - 24, `700 20px ${SANS}`, rgba(g.accent, 1), 'center'); }
    });
    ctx.globalAlpha = 1;
  }

  /* =====================================================================
     SCENES
     ===================================================================== */
  // Chunky title: stacked offset copies give a pixel-arcade extrusion.
  function arcadeTitle(s, x, y, size, p) {
    ctx.font = `900 ${size}px ${SANS}`; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    for (let k = 6; k > 0; k--) { ctx.fillStyle = k % 2 ? '#ff5a5f' : '#7a1f4a'; ctx.fillText(s, x + k * 2, y + k * 2); }
    const g = ctx.createLinearGradient(0, y - size, 0, y); g.addColorStop(0, '#fff3b0'); g.addColorStop(1, '#ffcc33');
    ctx.fillStyle = g; ctx.fillText(s, x, y);
    void p;
  }
  function drawIntro(t) {
    const out = eIn(prog(t, 2.4, 3.0));
    ctx.translate(0, -out * 30);
    const p1 = eBack(prog(t, 0.2, 0.75));
    ga(clamp(p1) * (1 - out)); ctx.save(); ctx.translate(960, 440); ctx.scale(p1, p1); arcadeTitle('История видеоигр', 0, 0, 120, p1); ctx.restore();
    const p2 = eOut(prog(t, 0.7, 1.2));
    ga(p2 * (1 - out)); txt('От Pong до Minecraft за 45 секунд', 960, 530 + (1 - p2) * 14, `500 42px ${SANS}`, rgba(C.muted, 1), 'center');
    if (t > 1.2 && Math.sin(t * 9) > 0) { ga(1 - out); txt('НАЖМИТЕ СТАРТ', 960, 640, `700 30px ${MONO}`, rgba(C.accent, 1), 'center'); }
  }
  function drawGame(g, i, t) {
    const tau = t - gStart(i);
    const slide = (1 - eOut(prog(tau, -0.3, 0.4))) * 120 - eIn(prog(tau, 5.55, 6.15)) * 120;
    ctx.translate(slide, 0);
    gameFrame(g, tau);
    infoPanel(g, i, tau);
  }
  function drawOutro(t) {
    const p1 = eBack(prog(t, 39.3, 39.9));
    ga(clamp(p1)); ctx.save(); ctx.translate(960, 400); ctx.scale(p1, p1); arcadeTitle('Полвека видеоигр', 0, 0, 112, p1); ctx.restore();
    const p2 = eOut(prog(t, 40.0, 40.6));
    ga(p2); txt('От двух палочек и квадрата до бесконечных миров', 960, 490 + (1 - p2) * 14, `500 40px ${SANS}`, rgba(C.ink, 0.9), 'center');
    const p3 = eOut(prog(t, 41.0, 41.6));
    ga(p3 * 0.8); txt('Неофициальный обзор. Сцены нарисованы заново; названия игр принадлежат правообладателям.', 960, 590, `400 22px ${SANS}`, rgba(C.muted, 1), 'center');
    if (t > 41.8 && Math.sin(t * 9) > 0) { ga(1); txt('ПРОДОЛЖИТЬ?', 960, 680, `700 34px ${MONO}`, rgba(C.accent, 1), 'center'); }
    if (t >= 40.0) { const f = 1 - prog(t, 40.0, 40.7); ga(0.3 * f * f); glow(960, 420, 900, [255, 236, 200], 1); }
  }

  /* =====================================================================
     FRAME RENDERER
     ===================================================================== */
  const DUST = Array.from({ length: 50 }, () => ({ x: rng() * W, y: rng() * H, r: .6 + rng() * 1.6, s: 4 + rng() * 12, ph: rng() * 6.28, a: .08 + rng() * .22 }));
  const grain = document.createElement('canvas'); grain.width = grain.height = 220;
  { const g = grain.getContext('2d'), img = g.createImageData(220, 220); for (let i = 0; i < img.data.length; i += 4) { const v = Math.random() * 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; } g.putImageData(img, 0, 0); }
  const grainPattern = ctx.createPattern(grain, 'repeat');
  function sceneTint(t) {
    let c = C.accent;
    GAMES.forEach((g, i) => { c = mix(c, g.accent, prog(t, gStart(i) - 0.4, gStart(i) + 0.4)); });
    return mix(c, C.accent, prog(t, OUTRO_T0 - 0.3, OUTRO_T0 + 0.5));
  }
  function render(t) {
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.globalAlpha = 1; ctx.shadowBlur = 0; setLS(0);
    ctx.fillStyle = '#08070c'; ctx.fillRect(0, 0, W, H);
    const tint = sceneTint(t);
    const bg = ctx.createRadialGradient(700, 420, 0, 700, 420, 1100);
    bg.addColorStop(0, rgba(tint, 0.12)); bg.addColorStop(0.55, rgba(tint, 0.04)); bg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
    for (const d of DUST) {
      const y = ((d.y - t * d.s) % H + H) % H, x = d.x + Math.sin(t * 0.3 + d.ph) * 12;
      ctx.globalAlpha = d.a * (0.6 + 0.4 * Math.sin(t * 1.3 + d.ph)); ctx.fillStyle = rgba(tint, 1); ctx.fillRect(x, y, d.r * 2, d.r * 2);
    }
    const ia = 1 - prog(t, 2.6, 3.1);
    if (ia > 0) { A = ia; ctx.save(); drawIntro(t); ctx.restore(); }
    GAMES.forEach((g, i) => {
      const tau = t - gStart(i);
      if (tau < -0.3 || tau > 6.15) return;
      A = Math.min(prog(tau, -0.3, 0.3), 1 - prog(tau, 5.55, 6.15));
      if (A <= 0.001) return;
      ctx.save(); drawGame(g, i, t); ctx.restore();
    });
    const oa = prog(t, OUTRO_T0 - 0.1, OUTRO_T0 + 0.4);
    if (oa > 0) { A = oa; ctx.save(); drawOutro(t); ctx.restore(); }
    A = 1; ctx.globalAlpha = 1; ctx.shadowBlur = 0; setLS(0);
    timeline(t);
    const vg = ctx.createRadialGradient(960, 540, 460, 960, 540, 1180);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.62)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
    ctx.save();
    const gx = reduceMotion ? 0 : Math.random() * 220, gy = reduceMotion ? 0 : Math.random() * 220;
    ctx.translate(-gx, -gy); ctx.globalAlpha = 0.03; ctx.fillStyle = grainPattern; ctx.fillRect(0, 0, W + 220, H + 220);
    ctx.restore();
    const fade = Math.max(1 - prog(t, 0, 0.25), prog(t, 44.2, 45));
    if (fade > 0) { ctx.globalAlpha = fade; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  }

  /* =====================================================================
     AUDIO (Web Audio API only, all synthesized). Each era gets chip
     sounds generated here; the Tetris scene plays the Russian folk song
     "Korobeiniki" (public domain). Events share the visuals' timings.
     ===================================================================== */
  let actx = null, master = null, noiseBuf = null, bus = null;
  const vol = { level: 0.8, muted: false };
  const effVol = () => (vol.muted ? 0 : vol.level * vol.level);
  function initAudio() {
    if (actx) return;
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    actx = new AC();
    const comp = actx.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 12; comp.ratio.value = 4; comp.attack.value = 0.004; comp.release.value = 0.25;
    master = actx.createGain(); master.gain.value = effVol(); master.connect(comp); comp.connect(actx.destination);
    noiseBuf = actx.createBuffer(1, actx.sampleRate * 2, actx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function makeBuses() {
    const run = actx.createGain(); run.connect(master);
    const music = actx.createGain(); music.gain.value = 0.9; music.connect(run);
    const sfx = actx.createGain(); sfx.connect(run);
    return { run, music, sfx };
  }
  const gainTo = (dest, v = 0) => { const g = actx.createGain(); g.gain.value = v; g.connect(dest); return g; };
  const osc = (type, freq, at, stop) => { const o = actx.createOscillator(); o.type = type; o.frequency.setValueAtTime(freq, at); o.start(at); o.stop(stop); return o; };
  const noise = (at, stop) => { const s = actx.createBufferSource(); s.buffer = noiseBuf; s.loop = true; s.start(at, Math.random() * 1.5); s.stop(stop); return s; };
  const filt = (type, freq, q = 1) => { const f = actx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q; return f; };
  function perc(g, at, peak, attack, decay) { g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(peak, at + attack); g.gain.exponentialRampToValueAtTime(0.0001, at + attack + decay); }
  function note(at, freq, dur, type = 'square', level = 0.05, dest) {
    const g = gainTo(dest || bus.sfx); g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(level, at + 0.005);
    g.gain.setValueAtTime(level, at + dur * 0.8); g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    const f = filt('lowpass', type === 'square' ? 3200 : 8000); f.connect(g); osc(type, freq, at, at + dur + 0.02).connect(f);
  }
  function sweepNote(at, f0, f1, dur, type = 'square', level = 0.05) {
    const g = gainTo(bus.sfx); perc(g, at, level, 0.004, dur);
    const o = osc(type, f0, at, at + dur + 0.05); o.frequency.exponentialRampToValueAtTime(f1, at + dur); const f = filt('lowpass', 3500); f.connect(g); o.connect(f);
  }
  function burst(at, dur, freq, level) { const g = gainTo(bus.sfx); perc(g, at, level, 0.003, dur); const f = filt('lowpass', freq, 0.7); f.frequency.setValueAtTime(freq, at); f.frequency.exponentialRampToValueAtTime(150, at + dur); f.connect(g); noise(at, at + dur + 0.05).connect(f); }
  function thud(at, level = 0.18) { const g = gainTo(bus.sfx); perc(g, at, level, 0.003, 0.18); const o = osc('sine', 150, at, at + 0.25); o.frequency.exponentialRampToValueAtTime(60, at + 0.15); o.connect(g); burst(at, 0.08, 1200, 0.05); }
  function whoosh(at, dur) {
    const g = gainTo(bus.sfx); g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(0.12, at + dur * 0.55); g.gain.linearRampToValueAtTime(0, at + dur);
    const f = filt('bandpass', 300, 0.9); f.frequency.setValueAtTime(300, at); f.frequency.exponentialRampToValueAtTime(2400, at + dur * 0.55); f.frequency.exponentialRampToValueAtTime(500, at + dur);
    f.connect(g); noise(at, at + dur + 0.05).connect(f);
  }
  function ambient(at, dur) {
    const end = at + dur, g = gainTo(bus.music);
    g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(0.03, at + 1.5); g.gain.setValueAtTime(0.03, end - 1.2); g.gain.linearRampToValueAtTime(0, end);
    const f = filt('lowpass', 420, 1); f.connect(g);
    [55, 82.41, 110].forEach(fr => [-7, 7].forEach(det => { const o = osc('sawtooth', fr, at, end); o.detune.value = det; o.connect(f); }));
  }
  function hit(at) {
    const kg = gainTo(bus.sfx); perc(kg, at, 0.8, 0.003, 0.6); const k = osc('sine', 140, at, at + 0.8); k.frequency.exponentialRampToValueAtTime(38, at + 0.35); k.connect(kg);
    [523.25, 659.25, 783.99, 1046.5].forEach((fr, i) => note(at + i * 0.07, fr, 0.5, 'square', 0.035));
  }

  // Korobeiniki, first phrase (public domain folk melody): [note, beats].
  const KORO = [['E5', 1], ['B4', .5], ['C5', .5], ['D5', 1], ['C5', .5], ['B4', .5], ['A4', 1], ['A4', .5], ['C5', .5], ['E5', 1], ['D5', .5], ['C5', .5], ['B4', 1.5], ['C5', .5], ['D5', 1], ['E5', 1], ['C5', 1], ['A4', 1], ['A4', 1]];
  const NF = { A4: 440, B4: 493.88, C5: 523.25, D5: 587.33, E5: 659.25 };
  const EVENTS = [];
  const ev = (t, play) => EVENTS.push({ t, play });
  // intro: coin-in blip and a rising arpeggio
  ev(0.2, at => { note(at, 987.77, 0.08, 'square', 0.05); note(at + 0.08, 1318.51, 0.25, 'square', 0.05); });
  ev(0.7, at => [261.63, 329.63, 392, 523.25, 659.25].forEach((f, k) => note(at + k * 0.06, f, 0.2, 'square', 0.035)));
  GAMES.forEach((_, k) => ev(1.8 + k * 0.08, at => note(at, 523.25 * Math.pow(2, k / 6), 0.12, 'triangle', 0.04)));
  GAMES.forEach((_, i) => { if (i > 0) ev(gStart(i) - 0.3, at => whoosh(at, 0.5)); ev(gStart(i) + 0.05, at => note(at, 220, 0.15, 'square', 0.04)); });
  // Pong
  PONG_PADDLE.forEach(s => { if (s < 5.6) ev(gStart(0) + s, at => note(at, 490, 0.07, 'square', 0.06)); });
  PONG_WALL.forEach(s => { if (s < 5.6) ev(gStart(0) + s, at => note(at, 245, 0.05, 'square', 0.05)); });
  ev(gStart(0) + 4.6, at => [523.25, 659.25].forEach((f, k) => note(at + k * 0.09, f, 0.1, 'square', 0.04)));
  // Space Invaders
  INV_STEPS.forEach((s, k) => { if (s[0] < 5.6) ev(gStart(1) + s[0], at => note(at, [98, 87.31, 77.78, 73.42][k % 4], 0.09, 'square', 0.08)); });
  SHOTS.forEach(([s], k) => { ev(gStart(1) + s, at => sweepNote(at, 1400, 300, 0.25, 'square', 0.04)); ev(gStart(1) + KILL_T[k], at => burst(at, 0.25, 3000, 0.12)); });
  // Tetris
  { let tt = gStart(2) + 0.35; const beat = 0.3; KORO.forEach(([n, b]) => { const f = NF[n]; ev(tt, at => note(at, f, b * beat * 0.92, 'square', 0.035)); tt += b * beat; }); }
  PIECES.forEach(p => ev(gStart(2) + p.t1, at => thud(at, 0.12)));
  ev(gStart(2) + CLEAR_T, at => [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, k) => note(at + k * 0.05, f, 0.15, 'square', 0.04)));
  // Platformer
  JUMPS.forEach(j => ev(gStart(3) + j, at => sweepNote(at, 260, 620, 0.2, 'square', 0.05)));
  COINS.forEach(c => ev(gStart(3) + c.t, at => { note(at, 1046.5, 0.06, 'square', 0.04); note(at + 0.06, 1567.98, 0.25, 'square', 0.04); }));
  ev(gStart(3) + STOMP_T, at => { thud(at, 0.2); sweepNote(at, 500, 180, 0.15, 'square', 0.04); });
  for (let k = 0; k < 22; k++) { const f = [130.81, 196, 220, 196][k % 4]; ev(gStart(3) + 0.3 + k * 0.25, at => note(at, f, 0.18, 'triangle', 0.07)); }
  // Doom
  ev(gStart(4), at => { const g = gainTo(bus.sfx); g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(0.06, at + 0.5); g.gain.setValueAtTime(0.06, at + 5.2); g.gain.linearRampToValueAtTime(0, at + 5.8); const f = filt('lowpass', 300); f.connect(g); osc('sawtooth', 55, at, at + 6).connect(f); osc('sawtooth', 58, at, at + 6).connect(f); });
  for (let s = 0.2; s < 5.8; s += 0.42) if (s < 1.6 || (s > 2.4 && s < 4.4) || s > 5.4) ev(gStart(4) + s, at => thud(at, 0.07));
  DOOM_SHOTS.forEach(s => ev(gStart(4) + s, at => { burst(at, 0.45, 2500, 0.3); const g = gainTo(bus.sfx); perc(g, at, 0.4, 0.003, 0.3); const o = osc('sine', 110, at, at + 0.4); o.frequency.exponentialRampToValueAtTime(40, at + 0.3); o.connect(g); }));
  // Voxel world: soft placements and calm piano-like notes
  CUBES.forEach((c, k) => { if (k % 5 === 0 && c.t < 5.6) ev(gStart(5) + c.t, at => { burst(at, 0.06, 900, 0.05); }); });
  [523.25, 659.25, 783.99, 587.33, 698.46, 523.25, 440, 392].forEach((f, k) => ev(gStart(5) + 0.4 + k * 0.65, at => { note(at, f, 1.2, 'sine', 0.06); note(at, f / 2, 1.4, 'sine', 0.03); }));
  // outro
  GAMES.forEach((_, k) => ev(OUTRO_T0 + 0.2 + k * 0.15, at => note(at, 523.25 * Math.pow(2, k / 6), 0.12, 'triangle', 0.035)));
  ev(40.0, at => hit(at));
  ev(41.8, at => { for (let k = 0; k < 4; k++) note(at + k * 0.5, 880, 0.08, 'square', 0.03); });
  EVENTS.sort((a, b) => a.t - b.t);

  /* =====================================================================
     MASTER TIMELINE
     ===================================================================== */
  const state = { running: false, t0: 0, perf0: 0, next: 0 };
  const clock = () => (actx ? actx.currentTime - state.t0 : (performance.now() - state.perf0) / 1000);
  const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  function scheduleAudio(t) {
    if (!actx) return;
    while (state.next < EVENTS.length && EVENTS[state.next].t < t + 0.25) {
      const e = EVENTS[state.next++];
      if (e.t >= t - 0.05) e.play(state.t0 + e.t);
    }
  }
  function updateHUD(t) {
    barEl.style.width = (t / DURATION * 100) + '%';
    timerEl.textContent = `${fmt(Math.min(t, DURATION))} / ${fmt(DURATION)}`;
    trackEl.setAttribute('aria-valuenow', Math.floor(t));
  }
  function start() {
    if (state.running) return;
    state.running = true; overlay.hidden = true;
    initAudio(); state.next = 0;
    if (actx) {
      if (actx.state === 'suspended') actx.resume();
      if (bus) { const old = bus.run; old.gain.cancelScheduledValues(actx.currentTime); old.gain.setValueAtTime(0, actx.currentTime); setTimeout(() => old.disconnect(), 200); }
      bus = makeBuses();
      state.t0 = actx.currentTime + 0.15;
      ambient(state.t0, DURATION);
      bus.run.gain.setValueAtTime(1, state.t0 + 44.2); bus.run.gain.linearRampToValueAtTime(0.0001, state.t0 + DURATION);
    } else state.perf0 = performance.now() + 150;
    requestAnimationFrame(frame);
  }
  function frame() {
    const t = clock(), tc = clamp(t, 0, DURATION);
    scheduleAudio(t); render(tc); updateHUD(tc);
    if (t >= DURATION) { finish(); return; }
    requestAnimationFrame(frame);
  }
  function finish() {
    state.running = false; posterT = 42.5; render(posterT);
    playLabel.textContent = 'Ещё раз';
    $('playIcon').toggleAttribute('hidden', true); $('replayIcon').toggleAttribute('hidden', false);
    $('hint').textContent = 'Посмотреть снова';
    overlay.hidden = false; playBtn.focus({ preventScroll: true });
  }

  /* =====================================================================
     CONTROLS
     ===================================================================== */
  function applyVolume() {
    if (actx && master) master.gain.setTargetAtTime(effVol(), actx.currentTime, 0.03);
    muteBtn.setAttribute('aria-pressed', String(vol.muted));
    muteBtn.setAttribute('aria-label', vol.muted ? 'Включить звук' : 'Выключить звук');
    $('waves').toggleAttribute('hidden', vol.muted); $('cross').toggleAttribute('hidden', !vol.muted);
  }
  playBtn.addEventListener('click', start);
  muteBtn.addEventListener('click', () => { vol.muted = !vol.muted; applyVolume(); });
  volEl.addEventListener('input', () => { vol.level = parseFloat(volEl.value); if (vol.muted && vol.level > 0) vol.muted = false; applyVolume(); });
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', fit);
  fit();
  playBtn.focus({ preventScroll: true });
})();
</script>

</body>
